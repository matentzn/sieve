  - id: sieve:tp/pmid-8456789-1
    type: TextPassage
    statement_text: >-
      The vascular theory of migraine, which dominated for decades, proposed that
      migraine attacks were primarily caused by vasodilation of cranial blood vessels,
      suggesting a cardiovascular component to the disorder.
    reported_in: [PMID:8456789]
    text_location: {section: "Introduction, page 2"}
    quote_verification: NOT_CHECKED
    contributions:
      - id: sieve:act/tp-pmid-8456789-1
