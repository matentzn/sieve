        role: EXTRACTOR
        date: "2024-06-10"
  - id: sieve:tp/pmid-31578890-1
    type: TextPassage
    statement_text: >-
      Current evidence overwhelmingly supports migraine as a complex neurological
      disorder originating in the central nervous system. The trigeminal-vascular
      system activation is secondary to cortical and brainstem dysfunction, not
      a primary cardiovascular event.
    reported_in: [PMID:31578890]
