      confidence: 0.92
      confidence_basis: PRIOR  # self-reported by the AI agent, uncalibrated
      description: >-
        Comprehensive AI review of ME/CFS classification evidence. Prompt: "Review
        the scientific evidence on whether ME/CFS should be classified as a
        psychiatric disorder or a physiological condition." Summary: Analysis of 203
        sources from 1990-2024 shows a clear shift away from psychiatric
        classification: pre-2000 ~60% of papers supported or were neutral on the
        psychiatric view; post-2015 <10% support it; WHO reclassified to neurological
        in ICD-11 (2019); NICE 2021 guidelines explicitly rejected psychological
        causation; multiple biological abnormalities now documented; graded exercise
        therapy (based on the deconditioning hypothesis) now contraindicated due to
        harm. Conclusion: Strong evidence against psychiatric classification.
      contributions:
