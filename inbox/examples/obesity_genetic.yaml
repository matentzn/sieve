      description: >-
        AI systematic review of obesity classification. Prompt: "Analyze whether
        obesity should be classified as a genetic disease based on current scientific
        evidence." Summary: Review of 156 sources indicates that while genetic factors
        contribute to obesity susceptibility, classifying obesity as a genetic disease
        is not supported by current evidence. Key findings: heritability estimates
        (40-70%) indicate significant non-genetic factors; monogenic obesity forms
        exist but represent <5% of cases; rapid prevalence increase incompatible with
        genetic causation; WHO, ICD, and major health organizations classify obesity
        as nutritional/metabolic, not genetic. Recommendation: Reject genetic disease
        classification for general obesity.
