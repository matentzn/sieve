        - type: Contribution
          contributor: {id: "anthropic/claude-haiku-4-5-20251001", type: Agent, subtype: software}
          contribution_type: interpretation
          specified_by: "medic-extractor/1, trigger_cue=indication_phrase"
  # (five more evidence lines follow, one per source document)
  evidence_synthesis:
    summary: >-
      Six regulatory documents from four jurisdictions attest the indication. Two of the six
      (EMA Bydureon, EMA Byetta) are different products under one authority and are NOT
      independent corroborations; likewise the two PMDA review reports. The effective count is
      four authorities, not six documents.
    score: {value: 1.0, description: Net Evidence Ratio (NER)}
    direction: supports
    method_note: >-
      MeDIC's own noisy-OR (0.999998) is a data-quality aggregate and must NOT be reported here
      as an evidence score.

# ---------------------------------------------------------------------------
gaps:
  no_direction_R1: >-
    MeDIC has no `direction` slot at all. Every assertion is implicitly SUPPORTS, so NER over
    MeDIC packets is always exactly 1.0 and tells a curator nothing (medic hazard H4). Adding
    direction is the single largest semantic gain available to MeDIC, and it has the data
    already — see M2.
  independence_R20: >-
    The noisy-OR treats six documents as six independent corroborations and reaches 0.999998.
    But EMA:bydureon and EMA:byetta are two products authorised by ONE authority reviewing one
    dossier lineage, and the two PMDA reports are two milestones for one drug. Corroboration
    arithmetic needs a notion of source independence; without one, "more documents" inflates
    confidence mechanically. Note MeDIC's own `reliability: MEDIUM` disagrees with 0.999998 —
    they are measuring different things and both are reported.
  two_confidences_one_word: >-
    `confidence.overall: 0.999998` (pair, data quality), `assertion.confidence.overall: 0.9`
    (linking fidelity), and `evidence.confidence: HIGH` (an evidence judgement) all use the
    word "confidence". Only the last one maps to `strength_of_evidence_provided`. This is
    hazard H2 and it is a live trap for any integration.
  source_role_is_evidence: >-
    `source_role: PRIMARY | INTERMEDIARY | NON_REGULATORY` is a genuine evidence-strength
    signal (the regulator itself beats a republisher) and has no home in the kernel today. It
    should feed `strength_of_evidence_provided` together with `evidence.confidence`.
  regulatory_vocabulary_missing: >-
    Neither `EvidenceSource: REGULATORY` nor `DocumentType: REGULATORY_LABEL` exists. Forcing a
    drug label into `EXPERT_CONSENSUS` or `DATABASE_RECORD` is wrong, and MeDIC is ~9,700 rows
    of the use case. Contribute upward before B2 closes.
