id: M3
title: A four-step transformation chain — ordered, contiguous, replayable, and not evidence at all
source:
  repo: medic
  path: products/drug_list.yaml
  entity: "Drug CHEBI:101853 (gemifloxacin), Russian GRLS record"
challenges: [R10, R13, R21, H5]

summary: >-
  The purest specimen of MeDIC's distinctive contribution and of the evidence/provenance
  boundary. A Russian regulatory string `Гемифлоксацин` becomes `CHEBI:101853` through four
  named steps — EXTRACTION, TRANSLATION (DeepL via babelon), GROUNDING, NORMALIZATION — each
  recording input and output, tool, tool version, agent, method, quality, flags, and a
  confidence with an explicit BASIS. The chain is monotone, mechanical, replayable offline from
  git-tracked SSSOM/Babelon decision stores, and byte-identical on rerun. Its aggregate
  confidence is 0.855. That number says NOTHING about whether gemifloxacin is approved in
  Russia; it says how sure MeDIC is that it linked the right ChEBI id. SEPIO has no counterpart
  for this structure, and it must not be flattened into a bag of evidence items.

# ---------------------------------------------------------------------------
as_is:
  identity:
    entity_type: drug
    id: MEDICNE:18eb4063-9c1c-5ae2-8868-620d124d2c16     # uuid5(entity_type, normalize(literal))
    mention_source: RUSSIA
    original_literal: Гемифлоксацин
    source_language: ru
    resolution:
      confidence: 0.855                                   # product-ish decay along the chain
      input_value: Гемифлоксацин
      output_value: CHEBI:101853
      pipeline:
        - category: EXTRACTION
          method: STRUCTURED_FIELD
          tool: medic-ingest-russia
          tool_version: 1.0.0
          input_value: Гемифлоксацин
          output_value: Гемифлоксацин
          quality: verbatim
          confidence: 1.0
          confidence_basis: DETERMINISTIC        # a verbatim read of a structured field cannot be wrong
          flags: []
        - category: TRANSLATION
          method: API
          tool: babelon
          tool_version: 0.3.6
          agent: {agent_id: "wikidata:Q116709136", agent_name: DeepL, agent_type: AI_AGENT}
          # note: no agent_version — DeepL publishes no engine version, and inventing one
          # would be worse than the honest gap
          input_value: Гемифлоксацин
          output_value: Gemifloxacin
          source_language: ru
          target_language: en-us
          quality: close
          translator_expertise: ALGORITHM
          status: CANDIDATE                      # awaiting human review
          confidence: 0.95
          confidence_basis: PRIOR                # NOT measured — a calibrated per-method constant
          flags: [unreviewed_machine]
        - category: GROUNDING
          method: LEXICAL_MATCH
          tool: medic-lexical-grounder
          tool_version: '1'
          input_value: Gemifloxacin              # == previous output_value (invariant I-8)
          output_value: CHEBI:101853
          output_label: gemifloxacin
          source_vocabulary: CHEBI
          quality: lexical_exact_normalized
          confidence: 0.9
          confidence_basis: MEASURED
          flags: []
        - category: NORMALIZATION
          method: DETERMINISTIC_RULE
          tool: medic-normalizer
          tool_version: '1'
          input_value: CHEBI:101853
          output_value: CHEBI:101853
          quality: identity
          target_namespace: CHEBI
          confidence: 1.0
          confidence_basis: DETERMINISTIC
      resolved_id: CHEBI:101853
      resolved_label: gemifloxacin
  reliability: MEDIUM                            # because of unreviewed_machine on the translation
  approvals:
    - authority: MOH_RUSSIA
      source: GRLS
      source_role: PRIMARY
      status: APPROVED
      approval_date: '20110812'
      application_number: ЛС-000940
      regulatory_document_url: https://grls.rosminzdrav.ru/Default.aspx
  evidence:
    - source_type: REGULATORY
      jurisdiction: RUSSIA
      approval_status: APPROVED
      confidence: HIGH
      reference: https://grls.rosminzdrav.ru/Default.aspx
      explanation: Russian Ministry of Health registered drug (approved 20110812)

# ---------------------------------------------------------------------------
# TRACK 1 — the minimal microschema
# Almost none of the above appears. That is CORRECT: the chain is provenance, not evidence.
# What survives is one line: the Russian MoH registered this drug.
# ---------------------------------------------------------------------------
minimal:
  id: medic:CHEBI_101853--APPROVED_IN--RUSSIA
  statement_text: gemifloxacin is an approved medicinal product in the Russian Federation
  has_evidence_lines:
    - direction_of_evidence_provided: SUPPORTS
      strength_of_evidence_provided: STRONG        # PRIMARY source_role + evidence.confidence HIGH
      evidence_source: REGULATORY                  # PROPOSED value (SPEC Q7)
      description: Russian Ministry of Health state register of medicines, registration ЛС-000940.
      has_evidence_items:
        - value: "Гемифлоксацин · ЛС-000940 · дата регистрации 12.08.2011"
          reported_in:
            id: GRLS:ЛС-000940
            title: Государственный реестр лекарственных средств (GRLS) record
            document_type: DATABASE_RECORD
  _dropped_deliberately:
    - "the four-step chain (provenance)"
    - "0.855 (data quality)"
    - "MEDICNE mention id (data quality / joinability)"
    - "unreviewed_machine flag (data quality)"

# ---------------------------------------------------------------------------
# TRACK 2 — the SIEVE profile (SEPIO core profile, Mondo claim types C001–C010)
# "Approved in Russia" is not a Mondo claim type, so there is no packet. The chain, which
# is the point of this record, maps almost 1:1 onto ResolutionChain / AlignmentStep:
# ordered, contiguous (step n output == step n+1 input, the check sieve.profile_checks
# runs inside packets), with method, agent, quality, confidence + basis and review status
# per step. It is data quality, kept apart from the one evidence line. Dates marked
# `_illustrative` are not in MeDIC's record.
# ---------------------------------------------------------------------------
sepio_monarch:
  misfit: >-
    "Gemifloxacin is an approved medicinal product in the Russian Federation" is a
    drug–jurisdiction regulatory-status claim. The profile's ten claim types are Mondo's
    (C001–C010), each with a Mondo subject and a Mondo-bound predicate. None takes a
    CHEBI subject, a regulatory-approval predicate or a jurisdiction object, so there is
    no SieveStatement and no packet. What fits, each validated on its own: the GRLS
    registry and the Russian MoH as InformationResource and SieveAgent, the GRLS record as
    an ExternalRecord (an honest fit: it is a record in a registry, read from it), the
    four-step resolution of Гемифлоксацин to CHEBI:101853 as a ResolutionChain, the
    software agents with their versions, and the single SieveEvidenceLine.
  fragments:
    - class: InformationResource
      data:
        id: sieve:resource/grls
        type: InformationResource
        label: Государственный реестр лекарственных средств (GRLS)
        description: Russian state register of medicines (MeDIC source_role PRIMARY).
        curiePrefixes: [GRLS]
        maintainer: sieve:agent/moh-russia
        defaultRole: PRIMARY
    - class: SieveAgent
      data:
        id: sieve:agent/moh-russia
        type: SieveAgent
        label: Ministry of Health of the Russian Federation
        subtype: organization
    - class: SieveAgent
      data:
        id: sieve:agent/medic-ingest-russia
        type: SieveAgent
        label: medic-ingest-russia
        subtype: software
        softwareVersion: 1.0.0
    - class: SieveAgent
      data:
        id: sieve:agent/deepl
        type: SieveAgent
        label: DeepL
        identifiers: ["wikidata:Q116709136"]
        subtype: software
        _softwareVersion: >-
          Deliberately absent: DeepL publishes no engine version. The profile leaves
          softwareVersion optional, so the honest gap stays visible as a missing value.
    - class: SieveAgent
      data:
        id: sieve:agent/medic-lexical-grounder
        type: SieveAgent
        label: medic-lexical-grounder
        subtype: software
        softwareVersion: "1"
    - class: SieveAgent
      data:
        id: sieve:agent/medic-normalizer
        type: SieveAgent
        label: medic-normalizer
        subtype: software
        softwareVersion: "1"

    - class: ExternalRecord
      data:
        id: GRLS:ЛС-000940
        type: ExternalRecord
        label: Гемифлоксацин
        resource: sieve:resource/grls
        dateAuthored: "2011-08-12"
        _dateAuthored_note: The registration date (MeDIC approval_date 20110812).
        recordMetadata:
          retrievedFrom: sieve:resource/grls
          recordIdentifier: ЛС-000940
          retrievalDate: 2026-08-13
          _retrievalDate_illustrative: Taken from the MeDIC build date; MeDIC stores no per-record read date here.
          sourceLabel: Гемифлоксацин

    # --- the chain: ordered, contiguous, replayable ----------------------------
    - class: ResolutionChain
      data:
        id: sieve:chain/grls-ls000940-subject
        type: ResolutionChain
        entitySlot: subject
        chainConfidence: 0.855
        _chainConfidence_note: Product of the step confidences, 1.0 x 0.95 x 0.9 x 1.0.
        _mentionId: MEDICNE:18eb4063-9c1c-5ae2-8868-620d124d2c16   # no profile slot, see gaps.mention_identity
        steps:
          - id: sieve:step/grls-ls000940-subject-1
            type: AlignmentStep
            category: EXTRACTION
            method: STRUCTURED_FIELD
            inputValue: Гемифлоксацин
            outputValue: Гемифлоксацин
            qualityCategory: extraction_verbatim
            confidence: 1.0
            confidenceBasis: DETERMINISTIC
            performedBy: [sieve:agent/medic-ingest-russia]
          - id: sieve:step/grls-ls000940-subject-2
            type: AlignmentStep
            category: TRANSLATION
            method: API
            inputValue: Гемифлоксацин
            outputValue: Gemifloxacin
            confidence: 0.95
            confidenceBasis: PRIOR
            reviewStatus: CANDIDATE
            performedBy: [sieve:agent/deepl]
            specifiedBy: [sieve:method/babelon-0.3.6]
            _qualityCategory: >-
              MeDIC quality `close` (and translator_expertise ALGORITHM) has no
              AlignmentQuality value: the enum has grounding_*, extraction_* and
              normalization_* values only. Left out.
            _languages: {source_language: ru, target_language: en-us}   # no profile slot
            _flags: [unreviewed_machine]   # no step-level flag slot; reviewStatus CANDIDATE carries it
          - id: sieve:step/grls-ls000940-subject-3
            type: AlignmentStep
            category: GROUNDING
            method: LEXICAL_MATCH
            inputValue: Gemifloxacin
            outputValue: CHEBI:101853
            mappingJustification: semapv:LexicalMatching
            qualityCategory: grounding_lexical_exact_normalized
            confidence: 0.9
            confidenceBasis: MEASURED
            performedBy: [sieve:agent/medic-lexical-grounder]
            _mappingSet: mappings/drug_grounding.sssom.tsv   # a repo path, not a URI; mappingSet is uri-typed
          - id: sieve:step/grls-ls000940-subject-4
            type: AlignmentStep
            category: NORMALIZATION
            method: DETERMINISTIC_RULE
            inputValue: CHEBI:101853
            outputValue: CHEBI:101853
            qualityCategory: normalization_identity
            confidence: 1.0
            confidenceBasis: DETERMINISTIC
            performedBy: [sieve:agent/medic-normalizer]

    # --- the one evidence line --------------------------------------------------
    - class: SieveEvidenceLine
      data:
        id: sieve:el/grls-ls000940
        type: SieveEvidenceLine
        description: Russian Ministry of Health state register of medicines, registration ЛС-000940 (2011-08-12).
        hasEvidenceItems: [GRLS:ЛС-000940]
        directionOfEvidenceProvided: supports
        strengthOfEvidenceProvided: high
        confidence: 0.855
        confidenceBasis: PRIOR
        _confidenceBasis_note: >-
          The line's data-quality number is the chain confidence. It combines DETERMINISTIC,
          PRIOR and MEASURED steps. ConfidenceBasis has no "composed" value, so the weakest
          basis in the chain (PRIOR, the translation) is given.
        independenceCluster: sieve:resource/grls
        contributions:
          - id: sieve:act/medic-interpret-grls-ls000940
            type: InterpretationActivity
            contributor: sieve:agent/medic-ingest-russia
            date: 2026-08-13
            _date_illustrative: The MeDIC build date of the old Track 2 block.
            methodType: RULE_BASED_STRENGTH
            readCoverage: STRUCTURED_RECORD
            accessStatus: OPEN_ACCESS
            rationale: A PRIMARY regulatory registration record maps to evidence confidence HIGH.

# ---------------------------------------------------------------------------
gaps:
  profile_misfit: >-
    (1) No regulatory-status claim type: "approved in jurisdiction J" has no Statement
    class, predicate value set, AggregationRule or inclusion score among Mondo's ten claim
    types. (2) AlignmentQuality has no translation values: MeDIC's `close` (and
    translator_expertise ALGORITHM) is dropped from the TRANSLATION step, although
    TransformationCategory has TRANSLATION. (3) No source / target language slots on
    AlignmentStep. (4) No step-level flags (`unreviewed_machine`); only reviewStatus.
    (5) ConfidenceBasis has no value for a composed number such as a chain confidence fed
    to a line. (6) No slot for a mention id (MEDICNE:). (7) AlignmentStep.mappingSet is a
    URI, and MeDIC records a repo-relative path, so it is left out. (8) No slots for
    approval status, application number as such, or the regulatory document URL beyond
    RetrievalMetadata.recordIdentifier.
  set_vs_sequence_R21: >-
    Addressed: ResolutionChain.steps is an ordered list of AlignmentSteps, and
    sieve.profile_checks verifies contiguity (step n outputValue == step n+1 inputValue,
    MeDIC invariant I-8) for every chain inside a packet. The chain no longer has to ride
    inside one evidence item as an opaque blob: it is a provenance object next to the
    record, not a member of hasEvidenceItems, so the bag semantics of evidence items do
    not touch it. Caveat: as a standalone fragment here, only the schema is checked, not
    contiguity.
  chain_decomposes_across_two_item_types: >-
    Resolved: the profile never decomposes the chain into items. Text and structure steps
    (EXTRACTION, TRANSLATION) and identifier steps (GROUNDING, NORMALIZATION) are all
    AlignmentSteps in one chain, told apart by `category`.
  translation_has_no_sepio_counterpart: >-
    Mostly addressed: TransformationCategory TRANSLATION plus method API, the agent
    (DeepL) with its wikidata identifier, the tool as specifiedBy, confidence 0.95 with
    basis PRIOR and reviewStatus CANDIDATE all have slots. Still open: no source / target
    language, no translator expertise, and no AlignmentQuality value for a translation
    (see profile_misfit).
  confidence_basis_is_a_good_idea_worth_stealing: >-
    Adopted: ConfidenceBasis (MEASURED | DETERMINISTIC | PRIOR) is in the profile, and a
    rule on both AlignmentStep and SieveEvidenceLine requires a basis whenever a
    confidence is given (D-062). It applies to data-quality confidence only, not to
    SieveEvidenceLine.scoreOfEvidenceProvided (strength), so an AI interpreter's
    self-reported strength still carries no basis. Open: no basis value for a composed
    confidence (chain -> line), where PRIOR is used here as the weakest component.
  mention_identity: >-
    Still open. The profile has no slot for a stable mention id; the MEDICNE: uuid5 is kept
    only as an annotation on the chain. ResolutionChain.id identifies one resolution run,
    not the surface form, so it cannot serve MeDIC's SSSOM joins.
