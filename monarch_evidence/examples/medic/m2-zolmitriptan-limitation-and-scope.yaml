id: M2
title: A "not indicated for" sentence with nowhere to go, and a silent scope narrowing that every confidence number scores 1.0
source:
  repo: medic
  path: products/indication_list.yaml
  entity: "IndicationAssociation CHEBI:10124 (zolmitriptan) INDICATION MONDO:0005475 (migraine with aura)"
challenges: [R1, R4, R13, R16, R22, Q7]

summary: >-
  Two defects in one record, both invisible to MeDIC's own quality machinery. (1) The label
  reads "migraine with OR WITHOUT aura"; the extractor emitted "migraine with aura" and grounded
  it to MONDO:0005475 — a narrower disease. Every step is marked `quality: verbatim` /
  `lexical_exact` with `confidence: 1.0`, and no `scope_narrowed` flag fires, because each step
  is individually correct: the output string IS a substring of the input. (2) The same section
  carries a `LIMITATION_STATEMENT` span containing an explicit non-indication — the one genuinely
  REFUTES-shaped signal in the whole product — which MeDIC deliberately retains, roles, and
  keeps out of the positive claim's negation scope, but then has no slot to express.

# ---------------------------------------------------------------------------
as_is:
  drug_id: CHEBI:10124
  drug_label: zolmitriptan
  disease_id: MONDO:0005475
  disease_label: migraine with aura              # <- narrower than what the label says
  relationship_type: INDICATION
  reliability: HIGH                              # <- MeDIC believes this record is fine
  assertions:
    - source: DAILYMED
      jurisdiction: USA
      document: DailyMed:3f0040a6-b1d6-3d73-e063-6294a90af23c
      assertion:
        relationship: INDICATION
        trigger_cue: indication_phrase
        trigger_span: are indicated for
        method: LLM
        agent: {agent_name: anthropic/claude-haiku-4-5-20251001, agent_type: AI_AGENT}
        confidence: {basis: MEASURED, subject: 0.9, object: 1.0, relationship: 1.0, overall: 0.9}
        flags: []                                # <- no AssertionFlag fired
        negation_scope: [0]                      # only span 0 is in scope for negation
      disease:
        id: MEDICNE:6b146c8c-c364-5687-a2bd-c356ae42c11e
        original_literal: migraine with aura     # <- what the extractor produced
        resolution:
          confidence: 1.0
          input_value: "Zolmitriptan orally disintegrating tablets are indicated for the acute treatment of migraine with or without aura in adults."
          output_value: MONDO:0005475
          pipeline:
            - category: EXTRACTION
              method: LLM
              output_value: migraine with aura
              quality: verbatim                  # <- technically true: it IS a substring
              span_role: SECTION_TEXT
              confidence: 1.0
              confidence_basis: MEASURED
              flags: []                          # <- no `scope_narrowed`
            - {category: GROUNDING, method: LEXICAL_MATCH, predicate_id: "skos:exactMatch", quality: lexical_exact, confidence: 1.0, output_value: "MONDO:0005475"}
            - {category: NORMALIZATION, method: DETERMINISTIC_RULE, quality: identity, confidence: 1.0, output_value: "MONDO:0005475"}
      evidence:
        source_type: REGULATORY
        source_role: INTERMEDIARY
        approval_status: APPROVED
        confidence: HIGH
        snippet: "Zolmitriptan orally disintegrating tablets are indicated for the acute treatment of migraine with or without aura in adults. Limitations of Use…"
      regulatory_status: {authority: FDA, status: APPROVED, approval_date: '19971125'}
      spans:
        - role: SECTION_TEXT
          section_code: LOINC:34067-9
          text: "Zolmitriptan orally disintegrating tablets are indicated for the acute treatment of migraine with or without aura in adults."
        - role: SUBSECTION_HEADER
          section_code: LOINC:34067-9
          text: "Limitations of Use"
        - role: LIMITATION_STATEMENT              # <- the REFUTES-shaped span
          section_code: LOINC:34067-9
          text: >-
            Only use zolmitriptan orally disintegrating tablets if a clear diagnosis of migraine
            has been established. If a patient has no response to zolmitriptan for the first
            migraine attack, reconsider the diagnosis of migraine before zolmitriptan is
            administered to treat any subsequent attacks. Zolmitriptan orally disintegrating
            tablets are not indicated for the prophylactic therapy of migraine or for the
            treatment of hemiplegic or basilar migraine.

# ---------------------------------------------------------------------------
# TRACK 1 — the minimal microschema
# The limitation statement becomes an evidence line on a DIFFERENT statement (a different
# predicate, per medic hazard H3 — a non-indication is not counter-evidence to an indication).
# The scope narrowing is corrected at the statement level, not hidden in a confidence number.
# ---------------------------------------------------------------------------
minimal:
  - id: medic:CHEBI_10124--INDICATION--MONDO_0005277
    statement_text: zolmitriptan is indicated for the acute treatment of migraine
    _note: >-
      MONDO:0005277 (migraine disorder) is the correct grounding for "migraine with or without
      aura". The as-is record's MONDO:0005475 (migraine with aura) is a narrowing error.
    has_evidence_lines:
      - direction_of_evidence_provided: SUPPORTS
        strength_of_evidence_provided: STRONG
        evidence_source: REGULATORY
        description: FDA-approved acute-treatment indication from the structured product label.
        has_evidence_items:
          - value: "Zolmitriptan orally disintegrating tablets are indicated for the acute treatment of migraine with or without aura in adults."
            reported_in:
              id: DailyMed:3f0040a6-b1d6-3d73-e063-6294a90af23c
              title: ZOLMITRIPTAN orally disintegrating tablets — structured product label
              document_type: REGULATORY_LABEL

  - id: medic:CHEBI_10124--INDICATION--MONDO_prophylaxis_of_migraine
    statement_text: zolmitriptan is indicated for the prophylactic therapy of migraine
    has_evidence_lines:
      - direction_of_evidence_provided: REFUTES        # the FDA label explicitly says it is not
        strength_of_evidence_provided: STRONG
        evidence_source: REGULATORY
        description: Explicit non-indication in the label's Limitations of Use subsection.
        has_evidence_items:
          - value: "Zolmitriptan orally disintegrating tablets are not indicated for the prophylactic therapy of migraine…"
            reported_in: {id: "DailyMed:3f0040a6-…", document_type: REGULATORY_LABEL}

  - id: medic:CHEBI_10124--INDICATION--<TODO:hemiplegic_migraine>
    statement_text: zolmitriptan is indicated for hemiplegic migraine
    _note: >-
      Mondo has `MONDO:0000700 familial hemiplegic migraine` and `MONDO:0020757 sporadic
      hemiplegic migraine` but no grouping term for "hemiplegic migraine" as the label writes
      it. A faithful evidence model must be able to hold the claim with the grounding
      unresolved, rather than forcing it to a narrower child — the same failure as the
      `migraine with aura` narrowing above.
    has_evidence_lines:
      - direction_of_evidence_provided: REFUTES
        strength_of_evidence_provided: STRONG
        evidence_source: REGULATORY
        description: Explicit non-indication in the label's Limitations of Use subsection.
        has_evidence_items:
          - value: "…or for the treatment of hemiplegic or basilar migraine."
            reported_in: {id: "DailyMed:3f0040a6-…", document_type: REGULATORY_LABEL}

# ---------------------------------------------------------------------------
# TRACK 2 — the SIEVE profile (SEPIO core profile, Mondo claim types C001–C010)
# Neither the indication nor the three non-indications is a Mondo claim type, so there is
# no packet. The fragments show the two defects in profile terms: (1) the as-is resolution
# chain with its extraction step REJECTED by review, the corrected chain beside it, and
# the indication line INVALIDATED and SUPERSEDED by a corrected line; (2) the limitation
# sentence as ONE TextPassage interpreted by THREE `disputes` lines, one per
# non-indication. Review acts and dates marked `_illustrative` are not in MeDIC's record.
# ---------------------------------------------------------------------------
sepio_monarch:
  misfit: >-
    "Zolmitriptan is indicated for the acute treatment of migraine" and the three
    non-indications in the Limitations of Use subsection (prophylaxis of migraine,
    hemiplegic migraine, basilar migraine) are drug–disease regulatory claims. The
    profile's ten claim types are Mondo's (C001–C010), with a Mondo subject and a
    predicate bound to a Mondo value set. None has a CHEBI subject or an INDICATION
    predicate, so there is no SieveStatement and no packet. Because a SieveEvidenceLine
    always targets its enclosing Statement (target_proposition is unused), the three
    `disputes` lines below cannot say WHICH non-indication each disputes except in
    free-text `description`. That is exactly the information hazard H3 says must not be
    lost. What fits: the passages, the as-is and corrected resolution chains with
    step-level review, the line correction mechanism (INVALIDATED + SUPERSEDED), and one
    passage reused by three lines.
  fragments:
    - class: InformationResource
      data:
        id: sieve:resource/dailymed
        type: InformationResource
        label: DailyMed
        description: Republishes FDA structured product labels (MeDIC source_role INTERMEDIARY).
        curie_prefixes: [DailyMed]
        default_role: AGGREGATOR
        derives_content_from: [sieve:resource/fda]

    # --- defect 1: the narrowing, as the as-is chain plus its correction -------
    - class: TextPassage
      data:
        id: sieve:tp/zolmi-indication
        type: TextPassage
        statement_text: "Zolmitriptan orally disintegrating tablets are indicated for the acute treatment of migraine with or without aura in adults."
        reported_in: [DailyMed:3f0040a6-b1d6-3d73-e063-6294a90af23c]
        text_location: {section: "LOINC:34067-9 INDICATIONS AND USAGE"}
        quote_verification: NOT_CHECKED
        contributions:
          - {id: sieve:act/medic-extract-zolmi-indication, type: SieveContribution, contributor: sieve:agent/medic-extractor, role: EXTRACTOR, specified_by: [sieve:method/medic-extractor-v1]}
        groundings:
          # as-is: every step locally "correct", chain confidence 1.0, result too narrow
          - id: sieve:chain/zolmi-object-asis
            type: ResolutionChain
            entity_slot: object
            chain_confidence: 1.0
            specified_by: [sieve:method/medic-extractor-v1]
            steps:
              - id: sieve:step/zolmi-object-asis-1
                type: AlignmentStep
                category: EXTRACTION
                method: LLM
                input_value: "Zolmitriptan orally disintegrating tablets are indicated for the acute treatment of migraine with or without aura in adults."
                output_value: migraine with aura
                span_role: SECTION_TEXT
                quality_category: extraction_verbatim
                confidence: 1.0
                confidence_basis: MEASURED
                performed_by: [sieve:agent/claude-haiku-4-5-20251001]
                review_status: REJECTED
                reviewed_by: sieve:agent/curator-example
                review_date: 2026-10-30
                _review_illustrative: >-
                  MeDIC's step is MACHINE (unreviewed). REJECTED is what a curator reading
                  the span records: the output is narrower than the source phrase, and is
                  not even a contiguous substring of it ("migraine with or without aura"),
                  so `extraction_verbatim` is wrong as well. No text_span, because no span
                  of the input yields this output.
              - id: sieve:step/zolmi-object-asis-2
                type: AlignmentStep
                category: GROUNDING
                method: LEXICAL_MATCH
                input_value: migraine with aura
                output_value: MONDO:0005475
                predicate: skos:exactMatch
                quality_category: grounding_lexical_exact
                _confidence_note: MeDIC's 1.0 has no basis here; left out (a confidence needs a basis).
              - id: sieve:step/zolmi-object-asis-3
                type: AlignmentStep
                category: NORMALIZATION
                method: DETERMINISTIC_RULE
                input_value: MONDO:0005475
                output_value: MONDO:0005475
                quality_category: normalization_identity
          # corrected: the full phrase, grounded by a curator to the parent term
          - id: sieve:chain/zolmi-object-corrected
            type: ResolutionChain
            entity_slot: object
            steps:
              - id: sieve:step/zolmi-object-corrected-1
                type: AlignmentStep
                category: EXTRACTION
                method: HUMAN
                input_value: "Zolmitriptan orally disintegrating tablets are indicated for the acute treatment of migraine with or without aura in adults."
                output_value: migraine with or without aura
                text_span: {section: "LOINC:34067-9", char_start: 84, char_end: 113}
                span_role: SECTION_TEXT
                quality_category: extraction_verbatim
                performed_by: [sieve:agent/curator-example]
                review_status: CONFIRMED
              - id: sieve:step/zolmi-object-corrected-2
                type: AlignmentStep
                category: GROUNDING
                method: HUMAN
                input_value: migraine with or without aura
                output_value: MONDO:0005277
                quality_category: grounding_curated
                performed_by: [sieve:agent/curator-example]
                review_status: CONFIRMED

    - class: SieveEvidenceLine
      data:
        id: sieve:el/zolmi-indication-asis
        type: SieveEvidenceLine
        description: >-
          As emitted: FDA-approved indication, read as zolmitriptan INDICATION MONDO:0005475
          (migraine with aura).
        has_evidence_items: [sieve:tp/zolmi-indication]
        evidence_item_sources: [sieve:resource/dailymed]
        direction_of_evidence_provided: supports
        strength_of_evidence_provided: high
        confidence: 0.9
        confidence_basis: MEASURED
        data_quality_flags: [MISGROUNDED]
        validity: INVALIDATED
        independence_cluster: sieve:resource/fda
        contributions:
          - id: sieve:act/medic-interpret-zolmi-indication
            type: InterpretationActivity
            contributor: sieve:agent/claude-haiku-4-5-20251001
            date: 2026-08-13
            _date_illustrative: MeDIC records no run date on the assertion.
            method_type: LLM_JUDGEMENT
            specified_by: [sieve:method/medic-extractor-v1]
            read_coverage: SECTIONS
            access_status: OPEN_ACCESS
            grounding_checked: NOT_CHECKED
        status_changes:
          - id: sieve:lsc/zolmi-indication-superseded
            type: LineStatusChange
            contributor: sieve:agent/curator-example
            date: 2026-10-30
            action: SUPERSEDED
            reason: Object grounded narrower than the source text; re-grounded to MONDO:0005277.
            replacement_line: sieve:el/zolmi-indication-corrected
    - class: SieveEvidenceLine
      data:
        id: sieve:el/zolmi-indication-corrected
        type: SieveEvidenceLine
        description: >-
          FDA-approved acute-treatment indication, read as zolmitriptan INDICATION
          MONDO:0005277 (migraine disorder).
        has_evidence_items: [sieve:tp/zolmi-indication]
        evidence_item_sources: [sieve:resource/dailymed]
        direction_of_evidence_provided: supports
        strength_of_evidence_provided: high
        supersedes: [sieve:el/zolmi-indication-asis]
        independence_cluster: sieve:resource/fda
        contributions:
          - id: sieve:act/curator-interpret-zolmi-indication
            type: InterpretationActivity
            contributor: sieve:agent/curator-example
            date: 2026-10-30
            method_type: EXPERT_JUDGEMENT
            read_coverage: SECTIONS
            access_status: OPEN_ACCESS

    # --- defect 2: the limitation sentence, one passage, three disputing lines --
    - class: TextPassage
      data:
        id: sieve:tp/zolmi-limitation
        type: TextPassage
        statement_text: >-
          Only use zolmitriptan orally disintegrating tablets if a clear diagnosis of migraine
          has been established. If a patient has no response to zolmitriptan for the first
          migraine attack, reconsider the diagnosis of migraine before zolmitriptan is
          administered to treat any subsequent attacks. Zolmitriptan orally disintegrating
          tablets are not indicated for the prophylactic therapy of migraine or for the
          treatment of hemiplegic or basilar migraine.
        reported_in: [DailyMed:3f0040a6-b1d6-3d73-e063-6294a90af23c]
        text_location: {section: "LOINC:34067-9 Limitations of Use"}
        quote_verification: NOT_CHECKED
        _spanRole: LIMITATION_STATEMENT       # no TextPassage slot; span_role exists only on AlignmentStep
        contributions:
          - {id: sieve:act/medic-extract-zolmi-limitation, type: SieveContribution, contributor: sieve:agent/medic-extractor, role: EXTRACTOR}
        groundings:
          - id: sieve:chain/zolmi-limitation-hemiplegic
            type: ResolutionChain
            entity_slot: object
            steps:
              - id: sieve:step/zolmi-limitation-hemiplegic-1
                type: AlignmentStep
                category: EXTRACTION
                method: LLM
                input_value: "Zolmitriptan orally disintegrating tablets are not indicated for the prophylactic therapy of migraine or for the treatment of hemiplegic or basilar migraine."
                output_value: hemiplegic migraine
                span_role: LIMITATION_STATEMENT
                trigger_cue: are not indicated for
                quality_category: extraction_canonicalized
                _note: >-
                  Illustrative: MeDIC does not extract the limitation's mentions. The output
                  expands the coordination "hemiplegic or basilar migraine", hence
                  canonicalized, not verbatim.
              - id: sieve:step/zolmi-limitation-hemiplegic-2
                type: AlignmentStep
                category: GROUNDING
                method: LEXICAL_MATCH
                input_value: hemiplegic migraine
                output_value: hemiplegic migraine
                quality_category: grounding_unresolved
                _note: >-
                  Mondo has familial (MONDO:0000700) and sporadic (MONDO:0020757) hemiplegic
                  migraine but no grouping term, so the step stays unresolved instead of being
                  forced to a child. output_value repeats the input because the slot is
                  required and there is no id to give.

    - class: SieveEvidenceLine
      data:
        id: sieve:el/zolmi-not-prophylaxis
        type: SieveEvidenceLine
        description: >-
          Target: "zolmitriptan is indicated for the prophylactic therapy of migraine".
          Explicit non-indication in the Limitations of Use subsection.
        has_evidence_items: [sieve:tp/zolmi-limitation]
        evidence_item_sources: [sieve:resource/dailymed]
        direction_of_evidence_provided: disputes
        strength_of_evidence_provided: high
        independence_cluster: sieve:resource/fda
        contributions:
          - {id: sieve:act/interpret-zolmi-not-prophylaxis, type: InterpretationActivity, contributor: sieve:agent/curator-example, date: 2026-10-30, method_type: EXPERT_JUDGEMENT, read_coverage: SECTIONS, access_status: OPEN_ACCESS}
    - class: SieveEvidenceLine
      data:
        id: sieve:el/zolmi-not-hemiplegic
        type: SieveEvidenceLine
        description: >-
          Target: "zolmitriptan is indicated for hemiplegic migraine" (object unresolved,
          see sieve:chain/zolmi-limitation-hemiplegic).
        has_evidence_items: [sieve:tp/zolmi-limitation]
        evidence_item_sources: [sieve:resource/dailymed]
        direction_of_evidence_provided: disputes
        strength_of_evidence_provided: high
        independence_cluster: sieve:resource/fda
        contributions:
          - {id: sieve:act/interpret-zolmi-not-hemiplegic, type: InterpretationActivity, contributor: sieve:agent/curator-example, date: 2026-10-30, method_type: EXPERT_JUDGEMENT, read_coverage: SECTIONS, access_status: OPEN_ACCESS}
    - class: SieveEvidenceLine
      data:
        id: sieve:el/zolmi-not-basilar
        type: SieveEvidenceLine
        description: >-
          Target: "zolmitriptan is indicated for basilar migraine".
        has_evidence_items: [sieve:tp/zolmi-limitation]
        evidence_item_sources: [sieve:resource/dailymed]
        direction_of_evidence_provided: disputes
        strength_of_evidence_provided: high
        independence_cluster: sieve:resource/fda
        contributions:
          - {id: sieve:act/interpret-zolmi-not-basilar, type: InterpretationActivity, contributor: sieve:agent/curator-example, date: 2026-10-30, method_type: EXPERT_JUDGEMENT, read_coverage: SECTIONS, access_status: OPEN_ACCESS}

# ---------------------------------------------------------------------------
gaps:
  profile_misfit: >-
    (1) No indication claim type, and no non-indication either: the ten claim types are
    Mondo's, so neither "indicated for" nor "not indicated for" has a Statement class, a
    packet, an AggregationRule or an inclusion score. (2) A SieveEvidenceLine targets its
    enclosing Statement only (target_proposition is unused), so a LIMITATION_STATEMENT that
    disputes three SEPARATE statements cannot name its targets outside a packet. Here
    they sit in free-text `description`. Inside a future indication profile each line would
    sit in its own statement's packet, which works. (3) TextPassage has no span-role slot:
    LIMITATION_STATEMENT / SUBSECTION_HEADER survive only on AlignmentStep.span_role, i.e.
    only once a mention in the span is grounded. (4) No regulatory document class (SPL),
    no slots for approval status, approval date (19971125) or authority. (5) An unresolved
    grounding has no "no output" form: AlignmentStep.output_value is required, so a
    grounding_unresolved step must repeat its input. (6) MeDIC's `scope_narrowed`,
    `negated_inversion`, `over_extraction`, `wrong_section` have no DataQualityFlag value;
    MISGROUNDED is the nearest.
  quality_gates_miss_composed_errors: >-
    Still open. The profile records the chain faithfully (ResolutionChain.steps,
    chain_confidence 1.0) and sieve.profile_checks checks step contiguity, but contiguity
    is exactly what the narrowing satisfies. Nothing composes per-step confidence into
    claim correctness, and a chain of 1.0s still scores 1.0. What the profile adds is the
    repair path: AlignmentStep.review_status REJECTED on the faulty step, a second chain
    with the curated grounding, and the line INVALIDATED and SUPERSEDED
    (SieveEvidenceLine.validity / status_changes / supersedes) instead of edited. Note that
    "migraine with aura" is not a contiguous substring of "migraine with or without aura",
    so a plain substring check on extraction_verbatim steps would have caught this one.
    The record's `summary` says otherwise.
  refutes_has_no_home: >-
    Half addressed. Direction is now supports | disputes on SieveEvidenceLine, so the
    limitation sentence gets `disputes` lines, and the profile's rule that a line targets
    its own Statement enforces hazard H3: a non-indication line can never sit on the
    indication statement. Still open: there is no indication / non-indication claim type
    to hold those statements (see profile_misfit), so the target exists only as text.
  operational_flags_are_not_evidence: >-
    Addressed in principle: SieveEvidenceLine.data_quality_flags (enum DataQualityFlag) is a
    separate slot from direction_of_evidence_provided, and flags gate the line rather than
    signing it, so extraction failures cannot leak into Direction. Open: the enum has no
    value for scope narrowing, negation inversion, over-extraction or wrong section;
    MISGROUNDED is used here as the nearest fit. Step-level flags have no slot at all
    (AlignmentStep has review_status, not flags).
  one_span_many_statements: >-
    Expressible: one TextPassage (sieve:tp/zolmi-limitation) is referenced by three
    SieveEvidenceLines through has_evidence_items, each with its own direction and
    interpretation act. Evidence items are referenced by id, so reuse costs nothing. The
    statements the lines target are still missing (profile_misfit).
