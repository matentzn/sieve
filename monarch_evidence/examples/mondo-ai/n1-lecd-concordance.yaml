# ---------------------------------------------------------------------------
gaps:
  score_is_source_reliability_not_evidence_strength: >-
    `scoreOfEvidenceProvided: 0.95` is a configured constant for OMIM, applied identically to
    every OMIM-derived line in 160k packets. It is a prior about the SOURCE, not an assessment
    of THIS evidence. That is defensible — it is exactly the "declared, revisable trust in an
    interpreter/source" the vision calls for — but it should be recorded as such (a trust level
    on the source agent, R12) rather than silently occupying the per-line score slot, or the
    number will be read as "this synonym is 95% right".
  NER_is_degenerate: >-
    With `directionOfEvidenceProvided: supports` on every line and no mechanism that can emit a
    `disputes` line, NER is identically 1.0 across the store. A metric that cannot vary is not
    a metric. Compare medic hazard H4 — the same defect from the same cause.
  absence_is_silent_R20: >-
    A source that does NOT carry the synonym contributes nothing, so "3 of 3 sources agree" and
    "3 of 12 sources agree" are indistinguishable in the packet. Real concordance evidence needs
    a denominator. This is the same independence problem as M1 seen from the other side.
  concordance_is_not_a_text_span: >-
    A `ConcordanceItem` has `sourceSubject` and `mappingJustification` but no `value` and no
    `reported_in`. Squeezing it into the kernel's `TextSpan` range is the one genuine misfit in
    the corpus. Either the kernel needs a second concrete item shape (a "record match"), or
    `has_evidence_items` must range over the abstract `EvidenceItem` and let profiles subclass.
    **This should be raised with SEPIO** — it affects the kernel's class list, not just its enums.
  no_curation_state_used: >-
    All 160,187 packets are `UNREVIEWED`. The curation machinery exists and has never been
    exercised at scale; nothing in the corpus shows a real ACCEPTED/REJECTED decision with a
    rationale. Any claim that the trust-accumulation model works is currently untested.
