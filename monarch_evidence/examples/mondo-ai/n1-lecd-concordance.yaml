gaps:
  score_is_source_reliability_not_evidence_strength: >-
    ADDRESSED: the per-source constant moves to InformationResource.qualityRatings (registry,
    dated via validFrom, scoped to SynonymStatement), and the inclusion score S applies it as
    the source prior q_i (D-060, D-063). The line keeps only direction and strength, so 0.95 can
    no longer be read as "this synonym is 95% right". Remaining: mondo-ai still writes the
    constant into scoreOfEvidenceProvided; migration must move it, not copy it.
  NER_is_degenerate: >-
    ADDRESSED in the profile: NER is replaced by the inclusion score S = tanh(L/2) on
    SieveStatement.score (+ strength band, direction), computed by a versioned AggregationRule
    with a claim prior L0 per claim type x proposingChannel and one line per independence
    cluster (SieveEvidenceLine.independenceCluster; DOID derivesContentFrom OMIM). S grows with
    the amount of evidence and can go negative, so it varies even without disputing lines.
    Still OPEN in the data: mondo-ai has no rule emitting S, so statement.score is empty here,
    and nothing yet emits `disputes` lines.
  absence_is_silent_R20: >-
    OPEN. The profile has no denominator either: no way to say "Orphanet record X exists, is
    mapped to this term, and does not list the synonym". lastConfirmed / lastConfirmedAgainst
    catch a source that DROPS a synonym it once carried (D-031), and ExternalRecord can be cited
    with direction disputes, but "never carried it" stays silent.
  concordance_is_not_a_text_span: >-
    ADDRESSED: ConcordantAssertion (the source's own SPO, reportedIn the ExternalRecord, with
    resource) + ExternalRecord (label as read, resource, recordMetadata) + one ResolutionChain
    per grounded slot (ConcordantAssertion.groundings, AlignmentStep with predicate and
    mappingSet). The SynonymStatement matrix permits ConcordantAssertion; no quote is invented.
  no_curation_state_used: >-
    OPEN (data, not model). All packets are NOT_VERIFIED with no AssertionDecision. The profile
    now offers the routes that would clear 160k synonyms without 160k sign-offs
    (DELEGATED_POLICY under a DecisionPolicy, BATCH_SIGN_OFF with a BatchSignOff), but none has
    been exercised.
  grounding_quality_label_has_no_value: >-
    NEW. mondo-ai's subject_normalization EXACT_MATCH_LOW_CONFIDENCE (on the OMIM line only) has
    no AlignmentQuality value and no confidence number, so the chain step carries neither
    qualityCategory nor confidence. Either AlignmentQuality needs a "low-confidence exact" value
    or mondo-ai must emit a numeric confidence with a basis.
  concordance_strength_has_no_rule: >-
    NEW. strengthOfEvidenceProvided is meant to be a band from the line's AggregationRule, but a
    COMPUTED_CONCORDANCE line needs no computedByRule (the profile check only demands it for
    RULE_BASED_STRENGTH). mondo-ai's "strong" therefore passes validation with nothing behind it.
  retrieval_release_unknown: >-
    NEW. ExternalRecord.recordMetadata needs a retrievalDate; mondo-ai records neither the date
    the source was read nor the release (D-055, D-058). The packet creation date stands in, and
    sourceRelease / lastConfirmedAgainst stay empty, so lapsed support cannot be detected. The
    mapping-set version used by the chains (AlignmentStep.mappingSetVersion, D-061) is likewise
    not recorded.
