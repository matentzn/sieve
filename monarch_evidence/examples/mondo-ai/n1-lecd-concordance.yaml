id: N1
title: Three ontologies agreeing — evidence lines whose "strength" is a hard-coded source reliability, and an NER that cannot fall below 1.0
source:
  repo: mondo-ai
  path: packet_store_merged/packets_000.jsonl (packet pkt_000564)
  entity: "MONDO:0010425 hasExactSynonym 'LECD'"
challenges: [R5, R6, R9, R13, R18, R20]
provenance_note: verbatim from the production store (camelCase keys as stored)

summary: >-
  The shape mondo-ai actually produces at scale — 160,187 packets, of which 155,004 have exactly
  one evidence line and all 165,818 evidence items are `ConcordanceItem`s. This one has three
  lines because three source ontologies (OMIM, Orphanet, DOID) each carry the synonym "LECD" for
  the term Mondo calls Lisch epithelial corneal dystrophy. Each line's
  `scoreOfEvidenceProvided` is a per-source constant configured in the pipeline (OMIM 0.95, ORDO
  0.90, DOID 0.85), not a judgement about this particular synonym. The NER is 1.0 — and can only
  ever be 1.0, because concordance evidence is constructed only where sources agree: a source
  that LACKS the synonym contributes no line at all, so absence is silent.

# ---------------------------------------------------------------------------
