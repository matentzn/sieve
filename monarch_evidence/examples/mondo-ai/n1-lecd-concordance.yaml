  id: pkt_000564
  statement:
    id: stmt_18a47f16593f
    type: SieveStatement
    statementText: "Lisch epithelial corneal dystrophy has exact synonym 'LECD'"
    subject: MONDO:0010425
    subjectLabel: Lisch epithelial corneal dystrophy
    predicate: {code: "oio:hasExactSynonym", label: exact synonym, system: "http://www.geneontology.org/formats/oboInOwl#"}
