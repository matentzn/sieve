# ---------------------------------------------------------------------------
# TRACK 1 — the minimal microschema
# The awkward part: a ConcordanceItem has no `value` and no `reported_in`. It is not a text
# span. To express it as an "A" shape you have to invent a quote, which is dishonest, or
# treat the source term itself as the document, which is a stretch. This is the one place in
# the corpus where the kernel's TextSpan-only item range genuinely does not fit.
# ---------------------------------------------------------------------------
minimal:
  id: mondo-ai:pkt_000564
  statement_text: "Lisch epithelial corneal dystrophy has exact synonym 'LECD'"
  has_evidence_lines:
    - direction_of_evidence_provided: SUPPORTS
      strength_of_evidence_provided: STRONG
      evidence_source: OTHER                     # concordance is not a study kind — see gaps
      description: "OMIM:620763 (corneal dystrophy, lisch epithelial) carries the synonym 'LECD'; skos:exactMatch to MONDO:0010425."
      has_evidence_items:
        - value: LECD                            # the synonym string, treated as the data item
          reported_in:
            id: OMIM:620763
            title: "corneal dystrophy, lisch epithelial"
            document_type: DATABASE_RECORD
    - direction_of_evidence_provided: SUPPORTS
      strength_of_evidence_provided: STRONG
      evidence_source: OTHER
      description: "Orphanet:98955 carries the synonym 'LECD'; skos:exactMatch to MONDO:0010425."
      has_evidence_items:
        - value: LECD
          reported_in: {id: "Orphanet:98955", title: Lisch epithelial corneal dystrophy, document_type: DATABASE_RECORD}
    - direction_of_evidence_provided: SUPPORTS
      strength_of_evidence_provided: MODERATE    # DOID's 0.85 weight demoted honestly
      evidence_source: OTHER
      description: "DOID:0060450 carries the synonym 'LECD'; skos:exactMatch to MONDO:0010425."
      has_evidence_items:
        - value: LECD
          reported_in: {id: "DOID:0060450", title: Lisch epithelial corneal dystrophy, document_type: DATABASE_RECORD}

# ---------------------------------------------------------------------------
# TRACK 2 — the same packet in the SIEVE profile (validates against schema/sieve.yaml)
# Per-line differences from `as_is`:
#   - each ConcordanceItem splits into a ConcordantAssertion (what the source asserts, in its
#     own ids) + the ExternalRecord that makes it + a ResolutionChain (how OMIM:620763 became
#     MONDO:0010425). The chain's mapping set is mondo.sssom.tsv; its version is not recorded.
#   - the lines carry NO scoreOfEvidenceProvided. 0.95 / 0.90 / 0.85 are per-source
#     constants: they belong on InformationResource.qualityRatings in the registry (see
#     packet's referenceSnapshot below), where the inclusion score S picks them up
#     as q_i (D-060, D-063).
#   - the NER (1.0) is dropped. It is not the inclusion score S, and nothing computed S, so
#     statement.score is empty until an AggregationRule runs.
#   - UNREVIEWED -> reviewState NOT_VERIFIED, no AssertionDecision.
# ---------------------------------------------------------------------------
