id: N2
title: Provenance turned into evidence — "a curator decided this" as an evidence line with a trust level
source:
  repo: mondo-ai
  path: src/mondo_ai/extraction/mondo_extractor.py (create_consortium_evidence_line / create_expert_evidence_line / create_candidate_literature_evidence_line) + tests/test_mondo_extractor.py
  entity: "MONDO:0005015 (diabetes mellitus) — an annotated synonym axiom with oboInOwl:source values"
challenges: [R10, R11, R12, R13, R18, Q3]
provenance_note: >-
  Reconstructed from the extractor code and its tests, using the ORCID and PMID shapes the code
  parses. `MondoExtractor` is exercised only by tests and is NOT yet wired into `PipelineRunner`,
  so no packet of this shape exists in the production store. The scores and trust levels below
  are exactly the constants in the code.

summary: >-
  The most interesting — and most contestable — thing mondo-ai does. Mondo axiom annotations
  carry `oboInOwl:source` strings; the extractor regexes ORCIDs and PMIDs out of them and turns
  each into an EVIDENCE LINE. Membership of a term in the Mondo release becomes an
  `AgentContribution` from the consortium with `trust_level: authority` and score 0.6; an ORCID
  in the source string becomes a curator contribution with `trust_level: curator` and score 0.8;
  a PMID becomes a `SieveDocument` marked "candidate — not yet verified" with score 0.4. Under
  the §7 test, the first two are *provenance* — they survive whether or not the synonym is
  correct — yet here they are load-bearing evidence with numeric weight. Whether that is a
  category error or the whole point is the sharpest open question in the corpus.

# ---------------------------------------------------------------------------
as_is:
  # what Mondo actually publishes
  source_axiom: |
    [Term]
    id: MONDO:0005015
    name: diabetes mellitus
    synonym: "DM" EXACT [ORCID:0000-0001-5208-3432, PMID:12345678]

  # what MondoExtractor makes of it
  extracted_provenance:
    orcids: ['0000-0001-5208-3432']
    pmids: ['12345678']
    raw_sources: ["ORCID:0000-0001-5208-3432", "PMID:12345678"]

  packet:
    id: pkt_mondo_0005015_dm
    statement:
      id: stmt_mondo_0005015_dm
      type: SieveStatement
      subject: MONDO:0005015
      subjectLabel: diabetes mellitus
      predicate: {code: "oio:hasExactSynonym", label: exact synonym}
      object: DM
      statementText: "diabetes mellitus has exact synonym 'DM'"
    status: UNREVIEWED
    hasEvidenceLines:

      # (1) organisational decision — the term is IN the Mondo release
      - id: el_consortium_00042
        type: SieveEvidenceLine
        directionOfEvidenceProvided: supports
        strengthOfEvidenceProvided: moderate
        scoreOfEvidenceProvided: 0.6
        hasEvidenceItems:
          - id: ev_consortium_00042
            type: AgentContribution
            evidenceItemType: AgentContribution
            contributor: {id: "mondo:consortium", type: Agent, name: Mondo Disease Ontology Consortium, subtype: organization}
            trustLevel: authority
            contributionType: decision
            content: Term included in Mondo Disease Ontology
            reference: http://purl.obolibrary.org/obo/mondo/releases/2026-08-01/mondo.owl
            description: "Organizational decision: MONDO:0005015 included in Mondo"

      # (2) expert determination — an ORCID appeared in the axiom's source
      - id: el_expert_00317
        type: SieveEvidenceLine
        directionOfEvidenceProvided: supports
        strengthOfEvidenceProvided: strong
        scoreOfEvidenceProvided: 0.8
        hasEvidenceItems:
          - id: ev_expert_00317
            type: AgentContribution
            evidenceItemType: AgentContribution
            contributor: {id: "ORCID:0000-0001-5208-3432", type: Agent, subtype: person}
            trustLevel: curator
            contributionType: decision
            content: Expert curator determination for synonym
            description: "Curator ORCID:0000-0001-5208-3432 approved this synonym"

      # (3) candidate literature — a PMID appeared in the axiom's source, unverified
      - id: el_lit_12345678_00042
        type: SieveEvidenceLine
        directionOfEvidenceProvided: supports
        strengthOfEvidenceProvided: weak
        scoreOfEvidenceProvided: 0.4
        hasEvidenceItems:
          - id: ev_lit_12345678_00042
            type: SieveDocument
            pmid: '12345678'
            subtype: {code: candidate_reference, label: Candidate Literature Reference, system: "mondo:evidence_status"}
            urls: [https://pubmed.ncbi.nlm.nih.gov/12345678/]
            description: "Candidate reference PMID:12345678 (cited in source, not yet verified)"

# ---------------------------------------------------------------------------
# TRACK 1 — what honestly survives
# Only (3), and only after someone reads the paper. (1) and (2) are provenance: they say who
# put the synonym in the ontology, not why anyone should believe it. Under the kernel they have
# no expression at all — which is exactly the pressure described in SPEC §4.3 / Q3.
# ---------------------------------------------------------------------------
minimal:
  id: mondo-ai:pkt_mondo_0005015_dm
  statement_text: "diabetes mellitus has exact synonym 'DM'"
  has_evidence_lines:
    - direction_of_evidence_provided: SUPPORTS
      strength_of_evidence_provided: WEAK
      evidence_source: OTHER
      description: >-
        Candidate reference cited in the Mondo axiom's oboInOwl:source; the abstract has not
        been checked for the synonym, so this is a pointer, not yet a verified evidence item.
      has_evidence_items:
        - value: "<not yet extracted — no verbatim span exists>"     # <- the honest state
          reported_in: {id: "PMID:12345678", document_type: PRIMARY_LITERATURE}
  _lost:
    - "the consortium decision (provenance, no kernel expression)"
    - "the ORCID curator determination (provenance, no kernel expression)"
    - "trust levels, contribution types, and the 0.6 / 0.8 / 0.4 weights"
  _note: >-
    `TextSpan.value` is REQUIRED, so an unverified PMID pointer cannot be represented at all
    without inventing a quote. Either the kernel needs a citation-only item shape, or such
    pointers must not enter the evidence model until a span is extracted. The second is
    cleaner and is what I would argue for.

# ---------------------------------------------------------------------------
# TRACK 2 — the same content in the SIEVE profile, sorted along the evidence/provenance line
# (validates against schema/sieve.yaml). Where each of mondo-ai's three lines went:
#   (1) consortium inclusion -> PROVENANCE: an OriginEvent (the claim was harvested, COPIED_FROM,
#       from the Mondo release record) plus a statement contribution by the consortium with
#       role PROVIDER. No evidence line, no weight.
#   (2) ORCID in the axiom source -> PROVENANCE: a statement contribution with role CURATOR
#       (D-004: the curator responsible for the axiom), with role and trust snapshotted. NOT an
#       AssertionDecision: the legacy annotation has no date, outcome or packet version, and
#       mondo-ai marks the packet UNREVIEWED. NOT an EXPERT_JUDGEMENT line: D-049 is provisional
#       and an InterpretationActivity needs a date the source does not carry.
#   (3) unverified PMID -> a Publication linked by statement.hasEvidence (direct, no
#       interpretation), not a scored line. It becomes a line only after someone reads it.
# The 0.6 / 0.8 / 0.4 constants and the NER are dropped. The curator's 0.8 survives as the
# agent's dated trust level (registry) and its snapshot on the contribution.
# ---------------------------------------------------------------------------
sepio_monarch:
  id: sieve:pkt_mondo_0005015_dm
  type: EvidencePacket
  version: "2026-08-01"
  statement:
    id: sieve:stmt_mondo_0005015_dm
    type: SynonymStatement
    subject: MONDO:0005015
    predicate: {code: oboInOwl:hasExactSynonym, label: exact synonym}
    object: DM
    statementText: "diabetes mellitus has exact synonym 'DM'"
    reviewState: NOT_VERIFIED
    proposingChannel: CURATOR
    hasEvidence: [PMID:12345678]
    origin:
      - id: sieve:origin/mondo-0005015-dm
        type: OriginEvent
        derivationType: COPIED_FROM
        sourceItem: sieve:rec/mondo-2026-08-01-MONDO_0005015
        sourceRelease: sieve:release/mondo-2026-08-01
        performedBy: [sieve:agent/mondo-ai-mondo-extractor]
        _note: >-
          No date: the extractor records none, and the release date is when the axiom was
          published, not when mondo-ai harvested it.
    contributions:
      - id: sieve:contrib/mondo-0005015-dm-consortium
        type: SieveContribution
        contributor: sieve:agent/mondo-consortium
        role: PROVIDER
        date: "2026-08-01"                     # release in which the axiom was read
        context: ["http://purl.obolibrary.org/obo/mondo/releases/2026-08-01/mondo.owl"]
      - id: sieve:contrib/mondo-0005015-dm-curator
        type: SieveContribution
        contributor: orcid:0000-0001-5208-3432
        role: CURATOR
        agentRoleAtTime: curator
        agentTrustAtTime: 0.8
  externalRecords:
    - id: sieve:rec/mondo-2026-08-01-MONDO_0005015
      type: ExternalRecord
      label: diabetes mellitus
      resource: infores:mondo
      recordMetadata:
        retrievedFrom: infores:mondo
        sourceRelease: sieve:release/mondo-2026-08-01
        recordIdentifier: MONDO:0005015
        retrievalDate: "2026-08-01"            # reconstructed: release date stands in for the read date
  publications:
    - id: PMID:12345678
      type: Publication
      pmid: "12345678"
      urls: ["https://pubmed.ncbi.nlm.nih.gov/12345678/"]
      resource: infores:pubmed
      generationContext:
        - {code: "sieve:basis_unknown"}
  # Registry data the packet refers to by id (SieveRegistry fragment, not part of the packet).
  _registry:
    resources:
      - {id: infores:mondo, type: InformationResource, label: Mondo, curiePrefixes: [MONDO], defaultRole: PRIMARY,
         maintainer: sieve:agent/mondo-consortium}
      - {id: infores:pubmed, type: InformationResource, label: PubMed, curiePrefixes: [PMID], defaultRole: PRIMARY}
    releases:
      - {id: sieve:release/mondo-2026-08-01, type: SourceRelease, ofResource: infores:mondo, version: "2026-08-01"}
    agents:
      - {id: sieve:agent/mondo-consortium, type: SieveAgent, subtype: organization, name: Mondo Disease Ontology Consortium,
         trustLevels: [{value: authority, validFrom: "2026-08-01"}]}
      - {id: orcid:0000-0001-5208-3432, type: SieveAgent, subtype: person,
         trustLevels: [{value: curator, level: 0.8, validFrom: "2026-08-01"}]}
      - {id: sieve:agent/mondo-ai-mondo-extractor, type: SieveAgent, subtype: software, name: mondo-ai MondoExtractor}

# ---------------------------------------------------------------------------
gaps:
  is_a_curator_decision_evidence: >-
    ADDRESSED, with the testimony question parked where Mondo parked it. The profile splits the
    two: consortium inclusion is provenance (OriginEvent COPIED_FROM the release record +
    SieveContribution role PROVIDER), and the ORCID is the curator responsible for the axiom
    (SieveContribution role CURATOR, agentRoleAtTime / agentTrustAtTime). Testimony has a
    defined home for NEW sign-offs: an AssertionDecision whose evidenceLine is an
    EXPERT_JUDGEMENT line weighted by the signer's trust (D-049, D-051). D-049 is still
    provisional, and a legacy ORCID annotation cannot be lifted into it (no date, outcome or
    packet version), so this record leaves it as provenance.
  circularity: >-
    ADDRESSED: inclusion in the release is an origin event, not a line, so it adds nothing to the
    inclusion score S. Where a sign-off does become an expert line, AssertionDecision records
    signedPacketVersion and the line is scored on the packet as signed, excluding itself (D-049);
    a no-look approval may not carry an evidenceLine (profile check BLIND_APPROVAL_EVIDENCE,
    D-066).
  scores_are_priors_not_measurements: >-
    ADDRESSED: each constant now has a typed, dated home instead of the line score. Agent trust
    -> SieveAgent.trustLevels (registry) snapshotted as SieveContribution.agentTrustAtTime;
    source quality -> InformationResource.qualityRatings; base rates -> the claim prior L0 per
    claim type x proposingChannel in the AggregationRule; AI self-confidence ->
    SieveEvidenceLine.confidence with required confidenceBasis (PRIOR). Here none of 0.6 / 0.8 /
    0.4 survives as evidence weight.
  no_span_no_evidence: >-
    PARTLY ADDRESSED: the unread PMID is a Publication linked by statement.hasEvidence (direct,
    uninterpreted), so it carries no weight. Once read it becomes a TextPassage
    (quoteVerification) under a line whose InterpretationActivity must state readCoverage and
    accessStatus (profile check). Still OPEN: whether the PMID resolves and is on topic
    (identifierVerified) lives only on an InterpretationActivity, so an uninterpreted citation
    cannot record "checked, resolves" or "candidate, unchecked".
  track1_pressure_Q3: >-
    OPEN for Track 1 (the kernel, unchanged). In the profile: every line must carry
    SieveEvidenceLine.contributions (InterpretationActivity with contributor, date, methodType),
    so who interpreted what is mandatory, not optional.
  legacy_curator_has_no_date: >-
    NEW. The ORCID in oboInOwl:source has no date, so the CURATOR contribution is undated. It
    cannot become an AssertionDecision (date required) or an InterpretationActivity (date
    required) without inventing one, and the trust snapshot (agentTrustAtTime 0.8) is as of an
    unknown time. Migrating ~all legacy ORCID annotations has the same problem (D-004).
  consortium_role_is_a_stretch: >-
    NEW. AgentRole has no value for "maintainer of the target ontology itself". PROVIDER ("Mondo
    retrieved the claim from this agent's data") is the nearest fit, but for Mondo's own release
    it is self-referential: the record says Mondo got the claim from Mondo. The honest reading is
    that the consortium contribution carries no information beyond the OriginEvent and could be
    dropped.
