             role: INTERPRETER, date: "2026-03-18", method_type: COMPUTED_CONCORDANCE,
             specified_by: [sieve:method/mondo-ai-concordance], read_coverage: STRUCTURED_RECORD}

      # added by `mondo-ai enrich`: the quote-bearing line
      - id: el_lit_9f3c1a72
        type: SieveEvidenceLine
