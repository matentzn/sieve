gaps:
  self_reported_confidence_is_not_a_score: >-
    ADDRESSED: the model's 0.95 is SieveEvidenceLine.confidence with confidence_basis PRIOR (the
    schema rule makes the basis mandatory, D-062). It is data quality: it gates or discounts the
    line and never becomes its strength or the inclusion score S (SieveStatement.score). The
    profile has no SELF_REPORTED basis; PRIOR ("assumed constant for the pinned model") is the
    nearest and slightly overstates what an uncalibrated self-report is.
  trust_belongs_to_the_organisation_not_the_model: >-
    ADDRESSED: SieveAgent.trust_levels (registry: numeric level, value, valid_from, optional
    domain) holds the organisation's trust in each model, and InterpretationActivity
    .agent_trust_at_time snapshots it on the act, so re-rating never rewrites past lines (D-049,
    D-052). Still OPEN: a LevelAssignment has no declaredBy / rationale, so WHO declared the
    trust and why is not recorded.
  synthesis_cannot_be_disputed: >-
    ADDRESSED: the verdict is a higher-order SieveEvidenceLine (hasEvidenceItems = the cited
    lines, EINT.STACKING), so a second interpreter is just another line, here with direction
    disputes. Remaining: Direction is supports | disputes only, so "REVIEW / ambiguous, neither
    for nor against" has to be rendered as disputes or dropped; and the recommended action
    (CONFIRM / REVIEW) has no slot (it lives in the rationale), because a verdict is evidence
    and the decision belongs to a human AssertionDecision (D-052).
  input_provenance_of_the_synthesis: >-
    PARTLY ADDRESSED: InterpretationActivity records the model (contributor -> SieveAgent
    .model_name), the prompt version (specified_by -> SieveMethod v1.0), the run (run_id), a
    reasoning_trace link, and the exact lines cited (hasEvidenceItems). Still OPEN: temperature and
    other call parameters have no slot on the act (ComputationalScore.parameters exists but only
    on that item), and the lines SHOWN to the model (all four) are not distinguished from the
    lines it CITED (three).
  flat_literature_weight: >-
    PARTLY ADDRESSED: the flat 0.5 is now honest about itself, a RULE_BASED_STRENGTH line with
    computed_by_rule (a constant rule) and read_coverage ABSTRACT_ONLY, and the quote is a
    TextPassage with quote_verification. The missing judgement (does the quote support the
    synonym?) would be an LLM_JUDGEMENT or EXPERT_JUDGEMENT line over the TextPassage. mondo-ai
    does not produce one, so the line is still a constant.
  unknown_access_status: >-
    Addressed: AccessStatus / ReadCoverage now have NOT_RECORDED, which the profile check
    accepts with a WARNING (READ_COVERAGE_NOT_RECORDED). The enricher read a PubMed abstract and
    records nothing about full-text access, so the act says NOT_RECORDED rather than guessing.
  passage_dependence_by_reference: >-
    Addressed: TextPassage.derived_from now takes packet item ids, so a passage can state its
    dependence on its paper (D-046 / D-057). Not filled in this record: mondo-ai does not
    record it, and reported_in already names the paper.
  undated_enrichment: >-
    NEW. InterpretationActivity.date is required but mondo-ai records no enrichment date (and no
    date on the extraction contribution), so the synthesis date stands in as an upper bound.
