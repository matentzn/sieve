id: N3
title: An LLM reads the packet and returns a verdict — synthesis as a first-class object, and a self-reported confidence pretending to be a score
source:
  repo: mondo-ai
  path: "src/mondo_ai/agents/synthesis.py + agents/prompts.py; enrichment/enricher.py"
  entity: "an enriched EvidencePacket after `mondo-ai enrich` then `mondo-ai synthesize`"
challenges: [R9, R11, R12, R13, R18, Q3]
provenance_note: >-
  Reconstructed from `SynthesisAgent.synthesize_async` and `PacketEnricher._build_literature_line`.
  The production store contains only the deterministic-scorer synthesis
  (`summary: "Scored by deterministic evidence scorer"`); no AI-synthesised packet is committed.
  Field names and constants below are exactly what the code emits.

summary: >-
  The end state of the mondo-ai pipeline and the concrete instance of the vision's core claim —
  that weak trust in any single AI interpretation, accumulated across many verifiable evidence
  lines, yields a defensible aggregate. A packet gets concordance lines (N1), then PubMed
  enrichment adds `SieveDocument` lines with an actual quote, then a `SynthesisAgent` (Claude or
  GPT, selected by config) reads the whole packet and returns
  `{action, confidence, summary, key_evidence}`. That becomes an `EvidenceSynthesis` with a
  `CurationActivity` naming the model and the prompt version. Two things are right about this
  (the synthesis is an object with provenance; the action maps to a direction) and two are
  wrong (the model's self-reported confidence is stored as if it were a measured score; the
  synthesis is not itself an evidence line, so a second interpreter cannot disagree with it).

# ---------------------------------------------------------------------------
as_is:
  packet_before_synthesis:
    id: pkt_000564
    statement:
      type: SieveStatement
      subject: MONDO:0010425
      predicate: {code: "oio:hasExactSynonym", label: exact synonym}
      object: LECD
      statementText: "Lisch epithelial corneal dystrophy has exact synonym 'LECD'"
    status: UNREVIEWED
    hasEvidenceLines:
      - {id: el_omim_0564, directionOfEvidenceProvided: supports, strengthOfEvidenceProvided: strong, scoreOfEvidenceProvided: 0.95, hasEvidenceItems: [{type: ConcordanceItem, sourceName: OMIM, sourceSubject: "OMIM:620763"}]}
      - {id: el_ordo_29022, directionOfEvidenceProvided: supports, strengthOfEvidenceProvided: strong, scoreOfEvidenceProvided: 0.9, hasEvidenceItems: [{type: ConcordanceItem, sourceName: "Orphanet (ORDO)", sourceSubject: "Orphanet:98955"}]}
      - {id: el_doid_59964, directionOfEvidenceProvided: supports, strengthOfEvidenceProvided: strong, scoreOfEvidenceProvided: 0.85, hasEvidenceItems: [{type: ConcordanceItem, sourceName: Disease Ontology, sourceSubject: "DOID:0060450"}]}
      # added by `mondo-ai enrich` — the FIRST item in the packet with a real quote
      - id: el_lit_9f3c1a72
        type: SieveEvidenceLine
        directionOfEvidenceProvided: supports
        strengthOfEvidenceProvided: moderate
        scoreOfEvidenceProvided: 0.5            # flat default for all literature, see gaps
        hasEvidenceItems:
          - id: ev_lit_1b04ef55
            type: SieveDocument
            pmid: '16109854'
            title: "Lisch epithelial corneal dystrophy (LECD): a rare X-linked disorder"
            quote: "Lisch epithelial corneal dystrophy (LECD) is characterised by feathery grey opacities…"
            quoteLocation: Abstract
            urls: [https://pubmed.ncbi.nlm.nih.gov/16109854/]
            description: "Literature from Cornea: Lisch epithelial corneal dystrophy (LECD): a rare X-linked disorder"

  prompt_sent_to_the_model: |
    # (agents/prompts.py — SYSTEM_PROMPT + SYNTHESIS_PROMPT_TEMPLATE, abridged)
    You are an expert ontology curator specializing in the Mondo Disease Ontology.
    Recommend ADD / CONFIRM / REJECT / REVIEW. Consider: the type and strength of each
    evidence item; whether evidence supports or contradicts; the reliability of sources
    (concordance from major ontologies is strong); literature evidence and its relevance;
    the overall balance of evidence. Cite specific evidence items by ID.
    ---
    ## Statement
    - Subject: Lisch epithelial corneal dystrophy (MONDO:0010425)
    - Predicate: oio:hasExactSynonym
    - Object: LECD
    ## Evidence Lines
    ### Evidence Line: el_omim_0564  (direction supports, strength strong, score 0.95) …
    ## Current Score
    Net Evidence Ratio: 1.0

  model_response:
    action: CONFIRM
    confidence: 0.95                            # <- the model's own number, unvalidated
    summary: >-
      Three major disease ontologies independently record 'LECD' as an exact synonym, and the
      literature uses the abbreviation in the same sense. No contradicting evidence.
    key_evidence: [el_omim_0564, el_ordo_29022, el_lit_9f3c1a72]

  packet_after_synthesis:
    evidence_synthesis:
      summary: >-
        Three major disease ontologies independently record 'LECD' as an exact synonym, and the
        literature uses the abbreviation in the same sense. No contradicting evidence.
      score: {value: 0.95, description: AI confidence score}     # <- stored as a Score
      direction: supports                                        # CONFIRM -> supports
      cited_evidence: [el_omim_0564, el_ordo_29022, el_lit_9f3c1a72]
      generated_by:
        id: act_7c2f91ab
        type: CurationActivity
        contributor: {id: claude-sonnet-4-20250514, type: Agent, name: claude-sonnet-4-20250514, description: "AI synthesis agent (anthropic)"}
        date: '2026-08-13'
        used: ["prompt_version:v1.0"]

# ---------------------------------------------------------------------------
# TRACK 1 — the microschema has no synthesis at all.
# The only thing that survives is the enrichment line, which is a clean "A" shape.
# ---------------------------------------------------------------------------
minimal:
  id: mondo-ai:pkt_000564
  statement_text: "Lisch epithelial corneal dystrophy has exact synonym 'LECD'"
  has_evidence_lines:
    - direction_of_evidence_provided: SUPPORTS
      strength_of_evidence_provided: MODERATE
      evidence_source: OTHER
      description: PubMed literature uses the abbreviation LECD for this disorder.
      has_evidence_items:
        - value: "Lisch epithelial corneal dystrophy (LECD) is characterised by feathery grey opacities…"
          reported_in:
            id: PMID:16109854
            title: "Lisch epithelial corneal dystrophy (LECD): a rare X-linked disorder"
            document_type: PRIMARY_LITERATURE
  # (plus the three concordance lines from N1)
  _lost: ["the synthesis, its author, its prompt version, and the recommended action"]

# ---------------------------------------------------------------------------
# TRACK 2 — the same synthesis in the SIEVE profile (validates against schema/sieve.yaml)
#   - the three concordance lines are rendered as in N1 (SynonymStatement prior claim + ExternalRecord
#     + ResolutionChain, no per-source score; weights live on InformationResource.quality_ratings).
#   - the enrichment line cites a TextPassage (the quote) reportedIn the Publication. Its flat
#     0.5 is the output of a constant rule, so the line is RULE_BASED_STRENGTH with computedByRule.
#   - the synthesis is a higher-order SieveEvidenceLine by the AI agent: hasEvidenceItems = the
#     lines it cited (key_evidence), methodType LLM_JUDGEMENT, specifiedBy the prompt version,
#     and the model's 0.95 as line confidence with confidenceBasis PRIOR — never as a score.
#     The organisation's trust in the model (0.65) is the agent's registry trust level,
#     snapshotted on the act.
#   - the second interpreter (gpt-4o, hypothetical, carried over from the earlier sketch) is a
#     second LLM_JUDGEMENT line with direction disputes; "neutral" has no value.
#   - CONFIRM is not a decision: UNREVIEWED -> reviewState NOT_VERIFIED, no AssertionDecision.
# ---------------------------------------------------------------------------
