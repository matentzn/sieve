sepio_monarch:
  # 1. the line being undercut, on the original packet
  - id: sieve:pkt_adsa_rnf170_erad
    statement:
      type: SieveStatement
      subject: MONDO:0012166              # autosomal dominant sensory ataxia 1
      predicate: {code: has_pathophysiology, label: has pathophysiology}
      object: dismech:node_impaired_erlin_rnf170_erad
    has_evidence_lines:
      - id: line_adsa_null_mouse
        type: SieveEvidenceLine
        direction_of_evidence_provided: supports
        strength_of_evidence_provided: strong
        evidence_source: MODEL_ORGANISM
        description: Rnf170-null mice develop ADSA-like proprioceptive loss and age-dependent gait abnormality.
        has_evidence_items:
          - {id: span_26433933_gait, type: SieveDataItem, value: "…age-dependent gait abnormalities in mice lacking the Rnf170 gene…", reported_in: PMID:26433933}
        # ▼ PROPOSED slot — nothing like this exists in sieve.yaml or minimal.yaml today
        admissibility_status: DISPUTED
        disputed_by: [line_adsa_undercut]

  # 2. the defeater, modelled as an EvidenceLine whose TARGET is another EvidenceLine
  - id: sieve:pkt_adsa_null_mouse_admissibility
    status: CONTROVERSIAL
    statement:
      id: stmt_adsa_null_mouse_admissibility
      type: SieveStatement
      # the SUBJECT of this statement is itself an evidence line — the nesting SEPIO allows
      subject: line_adsa_null_mouse
      predicate: {code: is_valid_evidence_for, label: is valid evidence for}
      object: dismech:node_impaired_erlin_rnf170_erad
      statement_text: >-
        The Rnf170-null mouse phenotype is not valid evidence for a loss-of-function mechanism
        in ADSA, because the null genotype corresponds to the recessive human disease.
    has_evidence_lines:
      - id: line_adsa_undercut
        type: SieveEvidenceLine
        direction_of_evidence_provided: disputes
        strength_of_evidence_provided: strong
        evidence_source: HUMAN_CLINICAL
        has_evidence_items:
          - {id: span_32943585_haploinsuff, type: SieveDataItem, value: "…heterozygous carriers of nonsense variants in RNF170 were later shown to be unaffected", reported_in: PMID:32943585}
          - {id: span_39177409_canine, type: SieveDataItem, value: "RNF170 variants were previously identified in human patients with autosomal recessive spastic paraplegia-85 (SPG85)…", reported_in: PMID:39177409}
        contributions:
          - {type: Contribution, contributor: {id: "dismech:agent/claude-opus", type: Agent, subtype: software}, contribution_type: interpretation, date: '2026-07-18'}
    decisions:
      - {decision_type: FLAG, rationale: "Open — no p.Arg199Cys knock-in animal exists.", certainty: high}

    # 3. prospective evidence — experiments that WOULD produce evidence lines
    planned_evidence:
      - id: exp_adsa_r199c_knockin_mouse
        label: Heterozygous Rnf170 p.Arg199Cys knock-in mouse versus null littermates
        would_produce_line_for: dismech:node_rnf170_protein_destabilization
        expected_direction: supports
        specified_by: >-
          If the heterozygous knock-in is affected while the heterozygous null is not, the
          allele acts by a mechanism other than haploinsufficiency.

# ---------------------------------------------------------------------------
gaps:
  defeaters_R15: >-
    The core gap. "This evidence is inadmissible for this claim" is categorically different
    from "this evidence refutes this claim", and conflating them corrupts any aggregation: a
    naive NER would count the undercutting argument as one more REFUTES line about the
    mechanism, when its actual effect is to REMOVE a SUPPORTS line from the tally. SEPIO's
    Statement-about-an-EvidenceLine nesting is the obvious home; whether it is legal, and what
    the pattern is, must be settled with Matt (SPEC Q5).
  direction_is_relative: >-
    The same text span is REFUTE relative to one claim and SUPPORTS relative to another.
    Direction lives on the line, not the item — the microschema gets this right, and this
    example is the proof that it must.
  prospective_evidence: >-
    `proposed_experiments` + `would_support` describe evidence that does not exist yet. This is
    a research-agenda object, arguably outside the evidence model entirely — but it is
    load-bearing for DisMech's purpose (surfacing what would resolve a controversy) and has no
    home in either profile.
  curation_state_leakage: >-
    `status: OPEN` and `kind: HUMAN_MODEL_MISMATCH` are curation-workflow state living inside
    the knowledge base. Track 2 has `CurationStatus`/`CurationDecision` for exactly this;
    DisMech has invented a parallel vocabulary. Worth reconciling before adoption.
  attaches_to_granularity: >-
    `attaches_to` points at pathophysiology NODES, not at the evidence lines on them. The
    undercutting relation is therefore not machine-recoverable even in principle from the
    current data — a curator has to read the rationale prose to know which line is being
    challenged.
