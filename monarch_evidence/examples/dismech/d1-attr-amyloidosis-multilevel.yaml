id: D1
title: Evidence attached at three granularities, with one paper reused four times
source:
  repo: dismech
  path: kb/disorders/ATTR_Amyloidosis.yaml
  entity: Hereditary Transthyretin Amyloidosis (MONDO — TTR amyloidosis)
challenges: [R2, R3, R7, R8, R11, R17, R19, Q2]

summary: >-
  A single DisMech disease record attaches the same flat EvidenceItem list at three
  different levels: to a mechanistic hypothesis group, to a pathophysiology node, and to a
  causal edge between two nodes. PMID:25604431 is used four separate times with four
  different snippets and four different explanations — the same document supporting four
  distinct claims. Two competing hypotheses coexist with different status
  (CANONICAL vs EMERGING), and edges are tagged with the hypothesis group they belong to.

# ---------------------------------------------------------------------------
# AS-IS — verbatim from the DisMech record (trimmed; snippets shortened with …)
# ---------------------------------------------------------------------------
as_is:

  # Level 1 — evidence on a HYPOTHESIS GROUP
  mechanistic_hypotheses:
    - hypothesis_group_id: canonical_variant_ttr_amyloidogenesis
      hypothesis_label: Canonical Variant-TTR Amyloidogenesis Model
      status: CANONICAL
      description: >-
        A pathogenic TTR variant destabilizes the circulating transthyretin tetramer.
        Tetramer dissociation releases monomers that misfold, oligomerize, and assemble into
        extracellular amyloid fibrils; progressive tissue accumulation then produces
        organ-specific dysfunction.
      evidence:
        - reference: PMID:25604431
          reference_title: "Transthyretin (ATTR) amyloidosis: clinical spectrum, molecular pathogenesis and disease-modifying treatments."
          supports: SUPPORT
          evidence_source: OTHER
          snippet: "TTR protein destabilised by TTR gene mutation is prone to dissociate from its native tetramer to monomer, and to then misfold and aggregate into amyloid fibrils"
          explanation: This directly states the canonical variant-to-tetramer-to-fibril sequence.
        - reference: PMID:29962408
          reference_title: Inhibition of the Amyloidogenesis of Transthyretin by Natural Products and Synthetic Compounds.
          supports: SUPPORT
          evidence_source: OTHER
          snippet: "The mutations destabilize the tetramer and/or monomer of TTR, and thus the stabilization of TTR is a key strategy for the treatment of TTR-related amyloidosis."
          explanation: The review independently supports TTR destabilization and its therapeutic tractability.

    - hypothesis_group_id: val30met_glutathione_signature
      hypothesis_label: Val30Met Glutathione and Inflammatory Metabolomic Signature
      status: EMERGING
      description: >-
        A cross-sectional metabolomics study associates symptomatic TTR-Val30Met disease with
        impaired glutathione homeostasis and inflammatory activation. Directionality and
        generalizability beyond this genotype remain unresolved.
      evidence:
        - reference: PMID:42436580
          reference_title: Disrupted glutathione homeostasis in the pathogenesis of TTR-V30M amyloidosis.
          supports: SUPPORT
          evidence_source: HUMAN_CLINICAL
          snippet: "These findings identify disrupted GSH homeostasis and inflammatory activation as metabolic features associated with symptomatic TTR-V30M amyloidosis in vivo…"
          explanation: >-
            The study reports an association with manifest Val30Met disease without
            establishing the causal direction.

  # Level 2 — evidence on a PATHOPHYSIOLOGY NODE
  pathophysiology:
    - name: TTR Tetramer Destabilization, Misfolding, and Oligomerization
      role: amplifier
      biological_processes:
        - preferred_term: protein homotetramerization
          term: {id: "GO:0051289", label: protein homotetramerization}
          modifier: DECREASED
      evidence:
        - reference: PMID:25604431
          reference_title: "Transthyretin (ATTR) amyloidosis: clinical spectrum, molecular pathogenesis and disease-modifying treatments."
          supports: SUPPORT
          evidence_source: OTHER
          snippet: "TTR protein destabilised by TTR gene mutation is prone to dissociate from its native tetramer to monomer, and to then misfold and aggregate into amyloid fibrils"
          explanation: The review supplies the complete tetramer-dissociation and monomer-misfolding sequence.

      # Level 3 — evidence on a CAUSAL EDGE, tagged with a hypothesis group
      downstream:
        - target: TTR Amyloid Fibril Formation and Extracellular Deposition
          causal_link_type: DIRECT
          description: Misfolded TTR monomers assemble into insoluble amyloid fibrils.
          hypothesis_groups: [canonical_variant_ttr_amyloidogenesis]
          evidence:
            - reference: PMID:25604431
              reference_title: "Transthyretin (ATTR) amyloidosis: clinical spectrum, molecular pathogenesis and disease-modifying treatments."
              supports: SUPPORT
              evidence_source: OTHER
              snippet: "to then misfold and aggregate into amyloid fibrils"
              explanation: The source directly links monomer misfolding to amyloid fibril aggregation.

# ---------------------------------------------------------------------------
# TRACK 1 — the minimal microschema
# ---------------------------------------------------------------------------
# Each host object grafts `HasEvidenceLines` onto its own container. The kernel imposes no
# container of its own, so the DisMech shape (hypothesis / node / edge) survives untouched.
minimal:

  - _host: mechanistic_hypotheses[canonical_variant_ttr_amyloidogenesis]
    statement_text: >-
      Variant TTR destabilizes the tetramer, releasing monomers that misfold and assemble
      into extracellular amyloid fibrils.
    has_evidence_lines:
      - direction_of_evidence_provided: SUPPORTS
        strength_of_evidence_provided: STRONG
        evidence_source: OTHER          # review article — see gaps, this is a DocumentType, not a study kind
        description: This directly states the canonical variant-to-tetramer-to-fibril sequence.
        has_evidence_items:
          - value: "TTR protein destabilised by TTR gene mutation is prone to dissociate from its native tetramer to monomer, and to then misfold and aggregate into amyloid fibrils"
            reported_in:
              id: PMID:25604431
              title: "Transthyretin (ATTR) amyloidosis: clinical spectrum, molecular pathogenesis and disease-modifying treatments."
              document_type: REVIEW
      - direction_of_evidence_provided: SUPPORTS
        strength_of_evidence_provided: MODERATE
        evidence_source: OTHER
        description: The review independently supports TTR destabilization and its therapeutic tractability.
        has_evidence_items:
          - value: "The mutations destabilize the tetramer and/or monomer of TTR, and thus the stabilization of TTR is a key strategy for the treatment of TTR-related amyloidosis."
            reported_in:
              id: PMID:29962408
              title: Inhibition of the Amyloidogenesis of Transthyretin by Natural Products and Synthetic Compounds.
              document_type: REVIEW

  - _host: mechanistic_hypotheses[val30met_glutathione_signature]
    statement_text: >-
      Impaired glutathione homeostasis and inflammatory activation are part of the
      pathogenesis of TTR-Val30Met amyloidosis.
    has_evidence_lines:
      - direction_of_evidence_provided: SUPPORTS
        strength_of_evidence_provided: WEAK      # association only; direction of causality unresolved
        evidence_source: HUMAN_CLINICAL
        description: Reports an association with manifest Val30Met disease without establishing causal direction.
        has_evidence_items:
          - value: "These findings identify disrupted GSH homeostasis and inflammatory activation as metabolic features associated with symptomatic TTR-V30M amyloidosis in vivo…"
            reported_in:
              id: PMID:42436580
              title: Disrupted glutathione homeostasis in the pathogenesis of TTR-V30M amyloidosis.
              document_type: PRIMARY_LITERATURE

  - _host: pathophysiology[TTR Tetramer Destabilization, Misfolding, and Oligomerization]
    statement_text: Destabilized TTR tetramers dissociate into aggregation-prone misfolded monomers.
    has_evidence_lines:
      - direction_of_evidence_provided: SUPPORTS
        strength_of_evidence_provided: STRONG
        evidence_source: OTHER
        description: The review supplies the complete tetramer-dissociation and monomer-misfolding sequence.
        has_evidence_items:
          - value: "TTR protein destabilised by TTR gene mutation is prone to dissociate from its native tetramer to monomer, and to then misfold and aggregate into amyloid fibrils"
            reported_in: {id: "PMID:25604431", document_type: REVIEW}

  - _host: pathophysiology[…].downstream[TTR Amyloid Fibril Formation and Extracellular Deposition]
    statement_text: >-
      TTR Tetramer Destabilization DIRECTLY causes TTR Amyloid Fibril Formation and
      Extracellular Deposition.
    has_evidence_lines:
      - direction_of_evidence_provided: SUPPORTS
        strength_of_evidence_provided: STRONG
        evidence_source: OTHER
        description: The source directly links monomer misfolding to amyloid fibril aggregation.
        has_evidence_items:
          - value: "to then misfold and aggregate into amyloid fibrils"
            reported_in: {id: "PMID:25604431", document_type: REVIEW}

# ---------------------------------------------------------------------------
# TRACK 2 — SIEVE (SEPIO-core profile driven by the Mondo requirements)
# ---------------------------------------------------------------------------
# MISFIT. None of the three DisMech hosts (hypothesis group, pathophysiology node, causal
# edge) is a Mondo claim type, so there is no packet. What does fit is rendered as
# fragments, each validated on its own class: the shared publications, the passages
# (one passage reused by two lines), and one SieveEvidenceLine per DisMech item with its
# interpretation act. `_target` records the DisMech host each line was attached to; the
# profile has nowhere to put it, because a line's target is always its enclosing Statement.
# Agent, method, date and run ids are illustrative (sieve:); DisMech's history/ store holds
# the real agent, model and date at section grain only.
sepio_monarch:
  misfit: >-
    The claims in this record are a mechanistic hypothesis group, a pathophysiology node
    ("TTR tetramer destabilization, misfolding and oligomerization") and a causal edge
    between two nodes, all on MONDO:0007100. None of them is a Mondo claim type: they are
    not term existence, definition, synonym, subclass, mapping, subset, metaclass or value-set
    claims, and they are not definitional disease attributes (C007), because a mechanism
    or a node-to-node causal link is not an RO attribute mandated by a Mondo design
    pattern. Rendering them as a DiseaseAttributeStatement (e.g. "has material basis in
    germline mutation in TTR") would replace the actual claims with a different, simpler
    one the evidence was never attached to. So there is no SieveStatement to enclose the
    lines, the three attachment levels collapse, and the CANONICAL / EMERGING hypothesis
    status has no slot. The evidence side (documents, verbatim passages, lines,
    interpretation provenance) fits unchanged.
  fragments:

    # --- documents: each publication exists once and is referenced by id ----------------
    - class: Publication
      data:
        id: PMID:25604431
        type: Publication
        pmid: "25604431"
        title: "Transthyretin (ATTR) amyloidosis: clinical spectrum, molecular pathogenesis and disease-modifying treatments."
        resource: infores:pubmed
        generation_context:
          - {code: "PT:review", label: Review}
    - class: Publication
      data:
        id: PMID:29962408
        type: Publication
        pmid: "29962408"
        title: Inhibition of the Amyloidogenesis of Transthyretin by Natural Products and Synthetic Compounds.
        resource: infores:pubmed
        generation_context:
          - {code: "PT:review", label: Review}
    - class: Publication
      data:
        id: PMID:42436580
        type: Publication
        pmid: "42436580"
        title: Disrupted glutathione homeostasis in the pathogenesis of TTR-V30M amyloidosis.
        resource: infores:pubmed
        generation_context:
          - {code: "PT:journal-article", label: Journal Article}
          - {code: "dismech:HUMAN_CLINICAL", label: human clinical (DisMech evidence_source)}

    # --- passages ------------------------------------------------------------------------
    # The hypothesis item and the node item quote the SAME sentence of PMID:25604431, so they
    # are one TextPassage referenced by two lines. The edge item quotes a sub-span: a second
    # passage. quote_verification is NOT_CHECKED: DisMech's validate-references compares PMID
    # snippets against the cached abstract, but no per-item outcome is recorded.
    - class: TextPassage
      data:
        id: sieve:tp/pmid-25604431-tetramer
        type: TextPassage
        statement_text: "TTR protein destabilised by TTR gene mutation is prone to dissociate from its native tetramer to monomer, and to then misfold and aggregate into amyloid fibrils"
        reported_in: [PMID:25604431]
        text_location: {section: Abstract}
        quote_verification: NOT_CHECKED
        contributions: &d1_extract
          - id: sieve:act/attr-extraction
            type: SieveContribution
            contributor: sieve:agent/dismech-curation-agent
            role: EXTRACTOR
            date: 2026-07-18
            specified_by: [sieve:method/dismech-references-skill]
            run_id: sieve:run/dismech-attr-session
    - class: TextPassage
      data:
        id: sieve:tp/pmid-25604431-fibrils
        type: TextPassage
        statement_text: "to then misfold and aggregate into amyloid fibrils"
        reported_in: [PMID:25604431]
        text_location: {section: Abstract}
        quote_verification: NOT_CHECKED
        contributions: *d1_extract
    - class: TextPassage
      data:
        id: sieve:tp/pmid-29962408-destabilize
        type: TextPassage
        statement_text: "The mutations destabilize the tetramer and/or monomer of TTR, and thus the stabilization of TTR is a key strategy for the treatment of TTR-related amyloidosis."
        reported_in: [PMID:29962408]
        text_location: {section: Abstract}
        quote_verification: NOT_CHECKED
        contributions: *d1_extract
    - class: TextPassage
      data:
        id: sieve:tp/pmid-42436580-gsh
        type: TextPassage
        _trimmed: as_is shortens this snippet with an ellipsis
        statement_text: "These findings identify disrupted GSH homeostasis and inflammatory activation as metabolic features associated with symptomatic TTR-V30M amyloidosis in vivo…"
        reported_in: [PMID:42436580]
        text_location: {section: Abstract}
        quote_verification: NOT_CHECKED
        contributions: *d1_extract

    # --- lines: one per DisMech item; direction only, DisMech records no strength --------
    - class: SieveEvidenceLine
      data:
        _target: mechanistic_hypotheses[canonical_variant_ttr_amyloidogenesis] (status CANONICAL)
        id: sieve:el/attr-canonical-25604431
        type: SieveEvidenceLine
        has_evidence_items: [sieve:tp/pmid-25604431-tetramer]
        direction_of_evidence_provided: supports
        independence_cluster: sieve:cluster/pmid-25604431
        contributions:
          - id: sieve:act/attr-interp-1
            type: InterpretationActivity
            contributor: sieve:agent/dismech-curation-agent
            role: INTERPRETER
            date: 2026-07-18
            method_type: LLM_JUDGEMENT
            specified_by: [sieve:method/dismech-references-skill]
            read_coverage: ABSTRACT_ONLY
            run_id: sieve:run/dismech-attr-session
            rationale: This directly states the canonical variant-to-tetramer-to-fibril sequence.
    - class: SieveEvidenceLine
      data:
        _target: mechanistic_hypotheses[canonical_variant_ttr_amyloidogenesis] (status CANONICAL)
        id: sieve:el/attr-canonical-29962408
        type: SieveEvidenceLine
