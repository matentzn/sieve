# ---------------------------------------------------------------------------
gaps:
  profile_misfit: >-
    Mechanism claims (hypothesis groups, pathophysiology nodes, causal edges) are not Mondo
    claim types, so SIEVE has no Statement to hold them. Lost: the claim each line is about
    (kept only as the `_target` annotation), the three attachment levels, causal_link_type,
    the GO process with its DECREASED modifier, and the hypothesis status. Without a
    statement there is also no inclusion score, review state or decision. What survives,
    and validates, is the evidence side: publications, passages, lines and interpretation acts.
  reuse_vs_duplication: >-
    Addressed for the evidence side. Each publication is one Publication object referenced
    by id. The sentence quoted twice is one TextPassage (reported_in the paper)
    referenced by two lines, and the sub-span is a second passage. All four passages share
    one extraction SieveContribution (same id and run_id), which records that they came from
    one act by one agent. What stays open is reuse across statements: with no statement,
    nothing records that the shared passage backs two different claims, beyond the two
    lines that point at it. See SPEC Q2.
  evidence_source_misuse: >-
    Partly addressed. The document-type axis has a home: Publication.generation_context
    takes the PubMed publication type (Review), separately from any study kind. DisMech's
    `evidence_source` is still per item, though, while generation_context sits on the
    publication. The OTHER tags here simply disappear (Review says more). A per-item study
    kind such as HUMAN_CLINICAL can only be copied up to the publication. The profile has no
    ECO slot, so an ECO binding (B2) has nowhere to land in SIEVE either.
  hypothesis_grouping: >-
    Still open. Claim grouping ("these edges belong to the same competing model", with
    CANONICAL / EMERGING status) has no counterpart in SIEVE. independence_cluster groups
    lines for counting, not claims into models, and must not be used for this (R19).
  granularity_rule: >-
    Still open. SIEVE puts no maximum on items per line (EINT.GRANULARITY, D-046 parked),
    so one line per DisMech item is valid. Here the three PMID:25604431 lines share an
    independence_cluster, so an aggregation rule counts the paper once per claim. The
    grouping rule (direction + strength + source + document) is still not written down.
  interpretation_provenance: >-
    Newly expressible. Each line carries an InterpretationActivity (agent, date, LLM_JUDGEMENT,
    method, read_coverage ABSTRACT_ONLY, run id, rationale = DisMech `explanation`). DisMech
    records the agent and date only in history/ at section grain, so per-item values need the
    Step 6 join. access_status is left out because DisMech does not record it.
