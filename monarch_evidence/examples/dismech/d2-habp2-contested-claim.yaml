gaps:
  profile_misfit: >-
    Only the gene-basis reading fits a claim type (C007). Lost: the mechanism itself (HABP2
    G534E causing loss of a tumour-suppressor function), the downstream causal edge to
    multifocal follicular cell transformation (causal_link_type UNKNOWN), the
    habp2_g534e_susceptibility hypothesis group and its DEPRECATED status, and the
    node-level mechanism_confidence. Two more things are lost inside the packet. (1)
    Allele specificity: the object is the gene HGNC:4798, and the variant p.G534E survives
    only in statementText, because C007 has no allele qualifier. (2) Susceptibility: Mondo
    would put a susceptibility gene on a susceptibility subtype term, not on the
    FNMTC grouping. The subject is kept as DisMech's disease to avoid inventing a term.
  no_aggregation: >-
    Addressed. The verdict is now data: the statement carries the inclusion score
    (score -0.6, direction disputes, strength band), computed by an AggregationRule, and an
    AssertionDecision records outcome REJECTED with inclusionScore, scoreBand, aggregationRule
    and signedPacketVersion. A REJECTED claim stays on record with its eight lines, which
    blocks re-proposal loops. The numbers here are illustrative: DisMech records no
    strengths, and the bands come from the Track 1 rendering.
  one_document_three_arguments: >-
    Partly addressed. SIEVE puts no maximum on items per line (D-046 parked), so the three
    PMID:26745718 arguments stay three lines, one per TextPassage. They share
    independenceCluster pmid-26745718, though, and only the strongest line per cluster
    counts. That is right if the three arguments rest on one cohort, and wrong if, as
    here, the expression argument uses independent data. There is still no term for
    "different reasoning, same document", so the split-or-merge rule is not testable.
  temporality: >-
    Partly addressed. "This line summarises those lines" is now expressible: the 2020
    review is a higher-order line (EINT.STACKING) whose hasEvidenceItems name the four
    replication lines. Whether the rule then discounts it, rather than adding it as an
    eighth vote, depends on the AggregationRule and is not in the data. Supersession, in
    SIEVE (SieveEvidenceLine.supersedes + validity INVALIDATED + LineStatusChange), means
    correcting a MISREAD line. It is not "later evidence defeats earlier evidence", so it is
    deliberately not used: the 2015 lines stay VALID and are outweighed. Ordering is
    available via Publication.dateAuthored, but the as_is gives no dates, so it is unset.
    "Refuted by later replication" has no dedicated slot.
  hypothesis_status_vs_statement_strength: >-
    Answered for the claim. The AssertionDecision outcome (REJECTED) is authoritative.
    Statement score, strength and direction are derived from the lines by the rule, and
    reviewState is workflow state. DisMech's mechanism_confidence (HYPOTHETICAL) and the
    hypothesis status (DEPRECATED) belong to the mechanism layer, which has no home. They
    survive only in the decision rationale.
  interpretation_provenance: >-
    Newly expressible. Every line has an InterpretationActivity (agent, date, LLM_JUDGEMENT,
    method, run id, rationale = DisMech `explanation`). readCoverage ABSTRACT_ONLY reflects
    DisMech's abstract cache. accessStatus is NOT_RECORDED (flagged as a WARNING by the
    profile checks), because DisMech does not record it. DisMech's per-item `evidence_source`
    (IN_VITRO vs HUMAN_CLINICAL for the two PMID:26222560 items) can only be copied up to
    Publication.generationContext, so which argument used which kind of study is lost.
