gaps:
  no_aggregation: >-
    In DisMech the verdict "the refutations win" exists only as prose. A consumer reading the
    YAML programmatically sees 3 SUPPORT and 5 REFUTE and has no defensible way to combine
    them. This is exactly what `EvidenceSynthesis` (R9) is for, and it is the clearest
    single argument for Track 2 in the whole corpus.
  one_document_three_arguments: >-
    PMID:26745718 yields three logically independent refutations. Under the naive "one line
    per snippet" rule they become three lines by accident; under the agreed grouping rule
    (group by direction+strength+source+document) they would WRONGLY merge into one, because
    the rule has no term for "different reasoning". The rule needs the escape clause made
    explicit and testable, or extraction pipelines will merge genuinely distinct arguments.
  temporality: >-
    Every refutation postdates the original claim, and the 2020 review is a synthesis OF the
    refutations, not an eighth independent vote. Counting it as one more REFUTES line
    double-counts. Neither profile can express supersession (R14) or "this line summarises
    those lines". `superseded_by` above is a proposal, not an existing slot.
  hypothesis_status_vs_statement_strength: >-
    Three different fields carry the same verdict at three levels — `mechanism_confidence:
    HYPOTHETICAL` on the node, `status: DEPRECATED` on the hypothesis group, and (in Track 2)
    `status: REJECTED` on the packet. Which is authoritative, and are the other two derived?
