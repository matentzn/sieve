[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "sieve"
version = "0.1.0"
description = "Scientific Evidence Evaluation & Verification Environment - Ontology assertion curation application"
authors = [
  {name = "Nicolas Matentzoglu", email = "nico@semanticly.ai"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"

dependencies = [
  "typer >= 0.9.0",
  "linkml-runtime >=1.9.4",
  "streamlit>=1.28.0",
  "duckdb>=0.9.0",
  "pydantic>=2.0.0",
  "rdflib>=7.0.0",
  "pyyaml>=6.0",
  "authlib>=1.6.5",
  "httpx>=0.28.1",
  "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "linkml>=1.9.3",
    "mypy>=1.17.1",
    "types-PyYAML>=6.0",
    "ruff>=0.4.8",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
    "pytest>=7.0.0",
    "linkml-map>=0.4.0",
]

[project.scripts]
sieve = "sieve.cli:main"

[tool.ruff]
# sieve_models.py is generated by `gen-pydantic`; never lint generated code.
extend-exclude = ["src/sieve/datamodel/sieve_models.py"]


# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/sieve/datamodel/sieve_pydantic.py",
  "src/sieve/datamodel/sieve.py",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/sieve/datamodel/sieve_pydantic.py",
  "src/sieve/datamodel/sieve.py",
]
