# Shared reference data for the profile example packets (SieveRegistry).
# Identifiers of rules, policies, pipelines and the panel are illustrative.
id: sieve:registry/example
type: SieveRegistry
version: "2026-10-29"
resources:
  - id: infores:omim
    type: InformationResource
    label: OMIM
    curie_prefixes: [OMIM]
    default_role: PRIMARY
    quality_ratings:
      - {level: 0.9, category: high, valid_from: "2026-01-01"}
  - id: infores:disease-ontology
    type: InformationResource
    label: Disease Ontology
    curie_prefixes: [DOID]
    default_role: PRIMARY
    derives_content_from: [infores:omim]
    quality_ratings:
      - {level: 0.8, category: high, valid_from: "2026-01-01"}
  - id: infores:orphanet
    type: InformationResource
    label: Orphanet
    curie_prefixes: [Orphanet]
    default_role: PRIMARY
  - id: infores:medgen
    type: InformationResource
    label: MedGen
    curie_prefixes: [MEDGEN, UMLS]
    default_role: AGGREGATOR
    derives_content_from: [infores:omim]
    quality_ratings:
      - {level: 0.6, category: moderate, valid_from: "2026-01-01"}
  - id: infores:ncit
    type: InformationResource
    label: NCI Thesaurus
    curie_prefixes: [NCIT]
    default_role: PRIMARY
    quality_ratings:
      - {level: 0.8, category: high, valid_from: "2026-01-01"}
  - id: infores:icd10cm
    type: InformationResource
    label: ICD-10-CM
    curie_prefixes: [ICD10CM]
    default_role: PRIMARY
  - id: infores:pubmed
    type: InformationResource
    label: PubMed
    curie_prefixes: [PMID]
    default_role: PRIMARY
releases:
  - {id: sieve:release/doid-2026-09-01, type: SourceRelease, of_resource: infores:disease-ontology, version: "2026-09-01", release_date: "2026-09-01"}
  - {id: sieve:release/omim-2019-04-30, type: SourceRelease, of_resource: infores:omim, version: "2019-04-30"}
  - {id: sieve:release/omim-2026-10-01, type: SourceRelease, of_resource: infores:omim, version: "2026-10-01", release_date: "2026-10-01"}
  - {id: sieve:release/icd10cm-2026, type: SourceRelease, of_resource: infores:icd10cm, version: "2026"}
agents:
  - id: orcid:0000-0001-5208-3432
    type: SieveAgent
    subtype: person
    roles:
      - {value: core curator, valid_from: "2018-01-01"}
    trust_levels:
      - {value: curator, level: 0.8, valid_from: "2018-01-01"}
  - id: sieve:agent/clingen-panel-example
    type: SieveAgent
    subtype: organization
    name: ClinGen expert panel (illustrative)
    trust_levels:
      - {value: authority, level: 1.0, valid_from: "2020-01-01", domain: gene-disease}
  - id: sieve:agent/mondo-ai-extractor
    type: SieveAgent
    subtype: software
    name: mondo-ai evidence agent
    software_version: 0.9.2
    model_name: example-llm-2026-06
    trust_levels:
      - {value: ai-agent, level: 0.7, valid_from: "2026-06-01"}
  - id: sieve:agent/concordance-pipeline
    type: SieveAgent
    subtype: software
    name: SPO concordance pipeline
    software_version: 1.4.0
  - id: sieve:agent/unrecorded-legacy-interpreter
    type: SieveAgent
    subtype: person
    identity_known: false
    name: Unrecorded legacy interpreter
    description: A human whose identity the legacy data does not record.
  - id: sieve:agent/policy-runner
    type: SieveAgent
    subtype: software
    name: mondo-ai policy runner
    software_version: 0.3.0
methods:
  - {id: sieve:method/concordance-workflow, type: SieveMethod, version: "1.4"}
  - {id: sieve:method/evidence-extraction-prompt, type: SieveMethod, version: "2026-09"}
  - {id: sieve:method/mondo-mapping-guide, type: SieveMethod, version: "2026-03"}
  - {id: sieve:method/statement-view-map, type: SieveMethod, label: LinkML-Map mondo_to_sepio.yaml, version: "0.3"}
aggregation_rules:
  - id: sieve:rule/synonym-v1.1
    type: AggregationRule
    version: "1.1"
    claim_type: SynonymStatement
    strength_bands: ["strong >= 0.8", "moderate >= 0.4", "weak < 0.4"]
    confidence_floor: 0.3
    # Illustrative parameters; calibrating them is the D-063 design task.
    scaling_factor: 2.0
    default_quality: 0.5
    stacked_lines: CAP_AND_ADD
    claim_priors:
      - {channel: SOURCE_INGEST, log_odds: 0.5}
      - {channel: CURATOR, log_odds: 1.0}
      - {channel: AI_AGENT, log_odds: -0.5}
    exclusive: true
    exclusivity_rule: An exact synonym belongs to one live term per branch (human / non-human); ABBREVIATION-typed synonyms are exempt.
  - id: sieve:rule/gene-disease-v1.3
    type: AggregationRule
    version: "1.3"
    claim_type: DiseaseAttributeStatement
    strength_bands: ["definitive >= 0.9", "strong >= 0.7", "moderate >= 0.4", "limited < 0.4"]
    # Illustrative parameters; calibrating them is the D-063 design task.
    scaling_factor: 2.0
    default_quality: 0.5
    stacked_lines: CAP_AND_ADD
    claim_priors:
      - {channel: CURATOR, log_odds: 0.5}
  - id: sieve:rule/negative-subclass-v1.0
    type: AggregationRule
    version: "1.0"
    claim_type: NegativeSubclassStatement
    strength_bands: ["strong >= 0.8", "moderate >= 0.4", "weak < 0.4"]
    # Illustrative parameters; calibrating them is the D-063 design task.
    scaling_factor: 2.0
    default_quality: 0.5
    stacked_lines: CAP_AND_ADD
    claim_priors:
      - {channel: CURATOR, log_odds: 0.5}
  - id: sieve:rule/mapping-v1.0
    type: AggregationRule
    version: "1.0"
    claim_type: MappingStatement
    strength_bands: ["strong >= 0.8", "moderate >= 0.4", "weak < 0.4"]
    # Illustrative parameters; calibrating them is the D-063 design task.
    scaling_factor: 2.0
    default_quality: 0.5
    stacked_lines: CAP_AND_ADD
    claim_priors:
      - {channel: LEXICAL_PIPELINE, log_odds: -1.0}
      - {channel: CURATOR, log_odds: 0.5}
    exclusive: true
    exclusivity_rule: An exact match is 1:1 into a source unless the mapping is marked as one of several preferred siblings.
policies:
  - id: sieve:policy/synonym-v2
    type: DecisionPolicy
    version: "2"
    approved_by: orcid:0000-0001-5208-3432
    approval_date: "2026-10-01"
    scope_claim_types: [SynonymStatement]
    scope_channels: [SOURCE_INGEST]
    acceptance_threshold: 0.8
    uses_rules: [sieve:rule/synonym-v1.1]
batches:
  - id: sieve:batch/mappings-2026-10-25
    type: BatchSignOff
    performed_by: [orcid:0000-0001-5208-3432]
    date: "2026-10-25"
    filter_query: "claim_type = MappingStatement AND S >= 0.9 AND hasSupportingLineFrom = infores:omim AND rule = sieve:rule/mapping-v1.0"
    result_set: ["sieve:pkt/MONDO_0008608-exact-ICD10CM_Q90@2026-10-25"]
    review_bands: ["0.95-1.00 NONE", "0.90-0.95 EYEBALLED"]
    spot_check_errors: 0
