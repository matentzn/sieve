# C003: MONDO:0010425 'Lisch epithelial corneal dystrophy' has exact synonym 'LECD'
# (corpus record N1). Shows how several evidence items sit in one evidence line:
#   - line A groups three prior claims (SynonymStatements by OMIM, Orphanet, DOID) into ONE argument;
#   - line B mixes item types: an ExternalRecord plus a ComputationalScore;
#   - line C is a higher-order line whose items are lines A and B.
# Lines reference items by id; the items themselves live once in the packet's typed
# lists. Line granularity (one item per line vs grouped) is parked (D-046); both are valid.
# Ids other than the MONDO / OMIM / Orphanet / DOID CURIEs are illustrative.
