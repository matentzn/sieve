      score_of_evidence_provided: 0.3
      computed_by_rule: sieve:rule/synonym-v1.1
      independence_cluster: infores:omim      # it rests on the OMIM record, like line A
      contributions:
        - id: sieve:act/lecd-label-match
          type: InterpretationActivity
          contributor: sieve:agent/concordance-pipeline
          date: "2026-10-31"
          method_type: RULE_BASED_STRENGTH
          specified_by: [sieve:method/concordance-workflow]
          read_coverage: STRUCTURED_RECORD
    - id: sieve:el/lecd-synthesis
      type: SieveEvidenceLine
      description: Higher-order line; its items are the two lines above.
      has_evidence_items:
        - sieve:el/lecd-concordance
        - sieve:el/lecd-label-match
      direction_of_evidence_provided: supports
      strength_of_evidence_provided: strong
      score_of_evidence_provided: 0.8
      confidence: 0.9
      confidence_basis: PRIOR
      contributions:
        - id: sieve:act/lecd-synthesis
